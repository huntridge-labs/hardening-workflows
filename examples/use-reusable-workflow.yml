# Example: How to use the reusable security hardening workflow in another project
#
# This example shows basic usage. For .NET Framework projects that require
# custom build steps, see examples/dotnet-framework-codeql.yml

# yamllint disable rule:brackets
name: Security Pipeline

on:  # yamllint disable-line rule:truthy
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Run weekly on Mondays at 2 AM UTC
  workflow_dispatch:
    inputs:
      scanners:
        description: 'Comma-separated scanner tokens'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sast
          - container
          - infrastructure
          - codeql
          - secrets

jobs:
  security-hardening:
    name: Security Hardening
    uses: huntridge-labs/hardening-workflows/.github/workflows/reusable-security-hardening.yml@2.6.0
    with:
      scanners: ${{ github.event.inputs.scanners || 'all' }}
      python_version: '3.11'
      aws_region: 'us-west-2'
      post_pr_comment: true
      codeql_languages: 'python'  # Only analyze Python, skip JavaScript

      # CodeQL Custom Build Options (uncomment if needed):
      # codeql_runner: 'windows-latest'           # Use Windows for .NET Framework
      # codeql_setup_msbuild: true                # Set up MSBuild
      # codeql_nuget_restore: 'MySolution.sln'    # Restore NuGet packages
      # codeql_custom_build_command: 'msbuild MySolution.sln /p:Configuration=Release'
      # codeql_setup_dotnet: true                 # Set up .NET SDK
      # codeql_dotnet_version: '8.0.x'            # .NET SDK version
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
      checks: write
      id-token: write
