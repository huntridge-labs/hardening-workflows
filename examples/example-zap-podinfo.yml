name: Example - ZAP DAST Scan (Podinfo)

# Comprehensive ZAP DAST scanning example using the reusable-security-hardening workflow
# This workflow demonstrates all ZAP scan types against the podinfo application

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      zap_scan_type:
        description: 'ZAP scan type to run'
        required: false
        type: choice
        options:
          - baseline
          - full
          - api
        default: baseline
      post_pr_comment:
        description: 'Post results as PR comment'
        required: false
        type: boolean
        default: true
      severity_threshold:
        description: 'Fail threshold (none = never fail)'
        required: false
        type: choice
        options:
          - none
          - low
          - medium
          - high
          - critical
        default: none

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
  security-events: write
  id-token: write

jobs:
  # Example 1: Baseline scan (passive, fast)
  # Good for: CI pipelines, quick security checks, PRs
  zap-baseline:
    name: ZAP Baseline Scan
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.zap_scan_type == 'baseline')
    uses: huntridge-labs/hardening-workflows/.github/workflows/reusable-security-hardening.yml@feat/zap-scanner
    with:
      scanners: zap
      zap_scan_mode: docker-run
      zap_app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      zap_app_ports: '9898:9898'
      zap_target_urls: 'http://127.0.0.1:9898'
      zap_healthcheck_url: 'http://127.0.0.1:9898/healthz'
      zap_scan_type: baseline
      zap_max_duration_minutes: 5
      post_pr_comment: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.post_pr_comment) }}
      allow_failure: true
      severity_threshold: ${{ inputs.severity_threshold || 'none' }}

  # Example 2: Full active scan (thorough, slower)
  # Good for: Nightly builds, release candidates, comprehensive security audits
  zap-full:
    name: ZAP Full Scan
    if: github.event_name == 'workflow_dispatch' && inputs.zap_scan_type == 'full'
    uses: huntridge-labs/hardening-workflows/.github/workflows/reusable-security-hardening.yml@feat/zap-scanner
    with:
      scanners: zap
      zap_scan_mode: docker-run
      zap_app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      zap_app_ports: '9898:9898'
      zap_target_urls: 'http://127.0.0.1:9898'
      zap_healthcheck_url: 'http://127.0.0.1:9898/healthz'
      zap_scan_type: full
      zap_max_duration_minutes: 15
      post_pr_comment: ${{ inputs.post_pr_comment }}
      allow_failure: true
      severity_threshold: ${{ inputs.severity_threshold || 'none' }}

  # Example 3: API scan using OpenAPI/Swagger spec
  # Good for: REST APIs, microservices with documented endpoints
  zap-api:
    name: ZAP API Scan
    if: github.event_name == 'workflow_dispatch' && inputs.zap_scan_type == 'api'
    uses: huntridge-labs/hardening-workflows/.github/workflows/reusable-security-hardening.yml@feat/zap-scanner
    with:
      scanners: zap
      zap_scan_mode: docker-run
      zap_app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      zap_app_ports: '9898:9898'
      zap_healthcheck_url: 'http://127.0.0.1:9898/healthz'
      zap_scan_type: api
      zap_api_spec: 'http://127.0.0.1:9898/swagger.json'
      zap_max_duration_minutes: 10
      post_pr_comment: ${{ inputs.post_pr_comment }}
      allow_failure: true
      severity_threshold: ${{ inputs.severity_threshold || 'none' }}

  # Example 4: Combined security scan (SAST + DAST)
  # Good for: Comprehensive security pipeline with both static and dynamic analysis
