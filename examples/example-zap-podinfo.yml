name: Example - ZAP DAST Scan (Podinfo)

# Comprehensive ZAP DAST scanning example using the reusable-security-hardening workflow
# This workflow demonstrates all ZAP scan types against the podinfo application

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      zap_scan_type:
        description: 'ZAP scan type to run'
        required: false
        type: choice
        options:
          - all
          - baseline
          - full
          - api
        default: all
      post_pr_comment:
        description: 'Post results as PR comment'
        required: false
        type: boolean
        default: true
      severity_threshold:
        description: 'Fail threshold (none = never fail)'
        required: false
        type: choice
        options:
          - none
          - low
          - medium
          - high
          - critical
        default: none

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
  security-events: write
  id-token: write

jobs:
  # Baseline scan (passive, fast)
  # Runs on: PRs (always), dispatch when 'all' or 'baseline' selected
  zap-baseline:
    name: ZAP Baseline Scan
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.zap_scan_type == 'baseline' || inputs.zap_scan_type == 'all'))
    uses: huntridge-labs/hardening-workflows/.github/workflows/reusable-security-hardening.yml@feat/zap-scanner
    with:
      scanners: zap
      zap_scan_mode: docker-run
      zap_app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      zap_app_ports: '9898:9898'
      zap_target_urls: 'http://127.0.0.1:9898'
      zap_healthcheck_url: 'http://127.0.0.1:9898/healthz'
      zap_scan_type: baseline
      zap_max_duration_minutes: 5
      post_pr_comment: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.post_pr_comment) }}
      allow_failure: true
      severity_threshold: ${{ inputs.severity_threshold || 'none' }}

  # Full active scan (thorough, slower)
  # Runs on: dispatch only when 'all' or 'full' selected
  zap-full:
    name: ZAP Full Scan
    if: github.event_name == 'workflow_dispatch' && (inputs.zap_scan_type == 'full' || inputs.zap_scan_type == 'all')
    uses: huntridge-labs/hardening-workflows/.github/workflows/reusable-security-hardening.yml@feat/zap-scanner
    with:
      scanners: zap
      zap_scan_mode: docker-run
      zap_app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      zap_app_ports: '9898:9898'
      zap_target_urls: 'http://127.0.0.1:9898'
      zap_healthcheck_url: 'http://127.0.0.1:9898/healthz'
      zap_scan_type: full
      zap_max_duration_minutes: 15
      post_pr_comment: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.post_pr_comment) }}
      allow_failure: true
      severity_threshold: ${{ inputs.severity_threshold || 'none' }}

  # API scan using OpenAPI/Swagger spec
  # Runs on: dispatch only when 'all' or 'api' selected
  zap-api:
    name: ZAP API Scan
    if: github.event_name == 'workflow_dispatch' && (inputs.zap_scan_type == 'api' || inputs.zap_scan_type == 'all')
    uses: huntridge-labs/hardening-workflows/.github/workflows/reusable-security-hardening.yml@feat/zap-scanner
    with:
      scanners: zap
      zap_scan_mode: docker-run
      zap_app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      zap_app_ports: '9898:9898'
      zap_healthcheck_url: 'http://127.0.0.1:9898/healthz'
      zap_scan_type: api
      zap_api_spec: 'http://127.0.0.1:9898/swagger.json'
      zap_max_duration_minutes: 10
      post_pr_comment: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.post_pr_comment) }}
      allow_failure: true
      severity_threshold: ${{ inputs.severity_threshold || 'none' }}
