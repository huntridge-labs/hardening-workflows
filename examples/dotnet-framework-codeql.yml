# Example: CodeQL scanning for legacy .NET Framework projects
#
# .NET Framework projects (targeting .NET 4.x) require:
# 1. Windows runner (for MSBuild and .NET Framework SDK)
# 2. MSBuild setup (not dotnet CLI)
# 3. NuGet restore for packages
# 4. Custom build command (autobuild doesn't work)
#
# This example shows how to configure the reusable workflow for such projects.

# yamllint disable rule:brackets
name: Security Pipeline (.NET Framework)

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: ~

jobs:
  security-hardening:
    name: Security Hardening
    uses: huntridge-labs/hardening-workflows/.github/workflows/reusable-security-hardening.yml@main
    with:
      scanners: 'codeql'

      # CodeQL configuration for .NET Framework
      codeql_languages: 'csharp'
      codeql_runner: 'windows-latest'
      codeql_setup_msbuild: true
      codeql_nuget_restore: 'YourSolution.sln'
      codeql_custom_build_command: 'msbuild YourSolution.sln /p:Configuration=Release /p:Platform="Any CPU"'

      # Other options
      enable_code_security: true
      post_pr_comment: true
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
      checks: write
      id-token: write

