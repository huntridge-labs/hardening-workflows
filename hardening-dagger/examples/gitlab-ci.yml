# Example: Using hardening-dagger in GitLab CI
#
# This demonstrates running the hardening pipeline in GitLab,
# showing that the same Dagger module works across platforms.

stages:
  - security

variables:
  # Container image location - can be any registry GitLab can access
  HARDENING_IMAGE: ghcr.io/huntridge-labs/hardening:latest
  # Or use GitLab's registry:
  # HARDENING_IMAGE: registry.gitlab.com/your-group/hardening:latest

security-scan:
  stage: security
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    # Install Dagger
    - apk add --no-cache curl
    - curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
    - export PATH="$PWD/bin:$PATH"

  script:
    # Run the hardening scan
    - |
      dagger call -m ${HARDENING_IMAGE} \
        scan \
        --source . \
        --scanners all \
        --repository "${CI_PROJECT_PATH}" \
        --branch "${CI_COMMIT_REF_NAME}" \
        --commit-sha "${CI_COMMIT_SHA}" \
        export --path ./hardening-reports

    # Check for threshold violations
    - |
      if [ -f "hardening-reports/THRESHOLD_EXCEEDED" ]; then
        echo "Security findings exceed threshold!"
        cat hardening-reports/THRESHOLD_EXCEEDED
        exit 1
      fi

  artifacts:
    paths:
      - hardening-reports/
    reports:
      # GitLab can parse SARIF for security dashboard
      sast: hardening-reports/hardening-report.sarif
    expire_in: 30 days

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# Optional: Post comment to MR
comment-mr:
  stage: security
  needs: [security-scan]
  image: alpine:latest
  script:
    - apk add --no-cache curl jq
    - |
      # Read the markdown report
      REPORT=$(cat hardening-reports/hardening-report.md)

      # Post to GitLab MR (if this is an MR pipeline)
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        curl --request POST \
          --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg body "$REPORT" '{body: $body}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
