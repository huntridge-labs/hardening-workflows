[project]
name = "hardening"
version = "2.10.0"
description = "Security hardening pipeline - run anywhere"
requires-python = ">=3.11"

# No dependencies needed - dagger-io SDK is provided by the Dagger runtime
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.editable]
packages = ["."]
