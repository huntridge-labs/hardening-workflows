name: 'Security Summary'
description: |
  Aggregate all security scan results into a unified report.

  This action is designed to run as the FINAL job in your security workflow, after all scanner
  jobs have completed. It automatically discovers and combines summaries from all security
  scanners into a formatted GitHub Step Summary.

  **Required Environment Variables:**
  - GITHUB_TOKEN: GitHub token for API access (set automatically in workflows)

  **Usage Example:**
  ```yaml
  security-summary:
    runs-on: ubuntu-latest
    needs: [bandit-scan, gitleaks-scan, trivy-iac-scan, clamav-scan]
    if: always()
    steps:
      - uses: huntridge-labs/hardening-workflows/.github/actions/security-summary@feat/migrate-to-composite-actions
  ```

  **Important:**
  - Add this job AFTER all your scanner jobs
  - List all scanner jobs in the 'needs' field
  - Use 'if: always()' to ensure it runs even if scanners fail
  - Use 'continue-on-error: true' on scanner jobs so they don't block the summary

inputs:
  summary_pattern:
    description: 'Artifact pattern to match scanner summaries'
    required: false
    default: 'scanner-summary-*'
  title:
    description: 'Title for the summary report'
    required: false
    default: '🔒 Security Scan Summary'
  show_metadata:
    description: 'Show workflow metadata (run number, branch, commit)'
    required: false
    default: 'true'
  show_stats:
    description: 'Show statistics about scanner results'
    required: false
    default: 'true'
  post_pr_comment:
    description: 'Post combined summary as PR comment'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Download all scanner summaries
      uses: actions/download-artifact@v6
      with:
        pattern: ${{ inputs.summary_pattern }}
        path: scanner-summaries
        merge-multiple: true
      continue-on-error: true

    - name: Generate combined summary
      shell: bash
      run: |
        echo "${{ inputs.title }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Show metadata if enabled
        if [ "${{ inputs.show_metadata }}" = "true" ]; then
          echo "**Workflow Run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

          # Use head_ref for PRs (source branch), ref_name for pushes
          BRANCH_NAME="${{ github.head_ref }}"
          if [ -z "$BRANCH_NAME" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          echo "**Branch:** \`$BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY

          echo "**Commit:** [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Check if we have any scanner summaries
        if [ -d "scanner-summaries" ] && [ "$(ls -A scanner-summaries 2>/dev/null)" ]; then
          SCANNER_COUNT=$(find scanner-summaries -name "*.md" -type f | wc -l)

          # Show stats if enabled
          if [ "${{ inputs.show_stats }}" = "true" ]; then
            echo "**Scanners Executed:** $SCANNER_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "## Scanner Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Combine all scanner summaries in alphabetical order
          for summary in $(find scanner-summaries -name "*.md" -type f | sort); do
            if [ -f "$summary" ]; then
              cat "$summary" >> $GITHUB_STEP_SUMMARY
            fi
          done
        else
          echo "⚠️ **No scanner summaries found**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This could mean:" >> $GITHUB_STEP_SUMMARY
          echo "- No scanners were executed" >> $GITHUB_STEP_SUMMARY
          echo "- Scanner jobs failed before generating summaries" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts did not upload correctly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the job logs for more details." >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "_Generated by [Hardening Workflows](https://github.com/huntridge-labs/hardening-workflows)_" >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Comment PR with security summary
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: actions/github-script@v8
      continue-on-error: true
      env:
        SUMMARY_TITLE: ${{ inputs.title }}
      with:
        script: |
          const fs = require('fs');

          console.log('Repository:', context.repo.owner + '/' + context.repo.repo);
          console.log('Event name:', context.eventName);
          console.log('PR number:', context.issue?.number);

          try {
            // Build comment body from all scanner summaries
            let commentBody = `## ${process.env.SUMMARY_TITLE}\n\n<!-- security-summary-comment-marker -->\n\n`;

            // Add metadata if available
            // Use head_ref for PRs (source branch), ref_name for pushes
            const branchName = process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME;
            if (branchName) {
              commentBody += `**Branch:** \`${branchName}\`\n`;
            }

            const shortSha = context.sha.substring(0, 7);
            commentBody += `**Commit:** [\`${shortSha}\`](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})\n`;
            commentBody += `**Workflow:** [#${context.runNumber}](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n`;

            // Check if we have scanner summaries
            if (fs.existsSync('scanner-summaries')) {
              const summaryFiles = fs.readdirSync('scanner-summaries')
                .filter(f => f.endsWith('.md'))
                .sort();

              if (summaryFiles.length > 0) {
                commentBody += `**Scanners Executed:** ${summaryFiles.length}\n\n`;
                commentBody += `## Scanner Results\n\n`;

                // Combine all scanner summaries
                for (const file of summaryFiles) {
                  const content = fs.readFileSync(`scanner-summaries/${file}`, 'utf8');
                  commentBody += content + '\n';
                }
              } else {
                commentBody += '⚠️ **No scanner summaries found**\n\n';
                commentBody += 'Check the workflow logs for details.\n\n';
              }
            } else {
              commentBody += '⚠️ **No scanner results available**\n\n';
            }

            commentBody += `\n---\n_Generated by [Hardening Workflows](https://github.com/huntridge-labs/hardening-workflows)_`;

            // GitHub PR comment limit is 262,144 bytes
            const MAX_COMMENT_LENGTH = 262000;
            if (commentBody.length > MAX_COMMENT_LENGTH) {
              console.log(`⚠️ Comment length (${commentBody.length}) exceeds limit, truncating...`);
              commentBody = commentBody.substring(0, MAX_COMMENT_LENGTH) + '\n\n... (report truncated, view full results in workflow artifacts)';
            }

            // Check for existing security summary comments to update instead of creating new ones
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            console.log('🔍 Found', comments.data.length, 'existing comments');

            const existingComment = comments.data.find(comment => {
              const hasMarker = comment.body.includes('security-summary-comment-marker');
              const isGitHubActions = comment.user.login === 'github-actions[bot]' || comment.user.type === 'Bot';
              console.log('Comment from', comment.user.login, 'type:', comment.user.type, 'has marker:', hasMarker);
              return hasMarker && isGitHubActions;
            });

            if (existingComment) {
              // Update existing comment with latest information
              console.log('🔄 Updating existing security summary comment');
              const timestamp = new Date().toLocaleString();
              const updatedBody = commentBody + `\n\n---\n*Last updated: ${timestamp} | [View Run](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: updatedBody
              });
            } else {
              // Create new comment
              console.log('📝 Creating new security summary comment');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }

            console.log('✅ Successfully posted/updated security summary comment');
          } catch (error) {
            console.log('❌ Failed to post security summary comment:', error.message);
            console.log('Error status:', error.status);

            if (error.status === 403) {
              console.log('🔒 Permission denied - this can happen when:');
              console.log('   • Running on a fork (security restriction)');
              console.log('   • Missing pull-requests: write permission');
              console.log('   • Repository settings restrict PR comments');
            } else if (error.status === 404) {
              console.log('🔍 Resource not found - check if PR exists');
            }

            console.log('📋 Security summary is still available in workflow summary and artifacts');
          }

branding:
  icon: 'file-text'
  color: 'blue'
