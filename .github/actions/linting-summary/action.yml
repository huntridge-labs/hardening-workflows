name: 'Linting Summary'
description: |
  Aggregate all linter results into a unified report.

  This action is designed to run as the FINAL job in your linting workflow,
  after all linter jobs have completed. It automatically discovers and combines
  summaries from all linters into a formatted GitHub Step Summary.

  **Required Environment Variables:**
  - GITHUB_TOKEN: GitHub token for API access (set automatically in workflows)

  **Usage Example:**
  ```yaml
  linting-summary:
    runs-on: ubuntu-latest
    needs: [yaml-lint, json-lint, python-lint, javascript-lint, dockerfile-lint, terraform-lint]
    if: always()
    steps:
      - uses: huntridge-labs/hardening-workflows/.github/actions/linting-summary@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ```

  **Important:**
  - Add this job AFTER all your linter jobs
  - List all linter jobs in the 'needs' field
  - Use 'if: always()' to ensure it runs even if linters fail
  - Use 'continue-on-error: true' on linter jobs so they don't block the summary

inputs:
  summary_pattern:
    description: 'Artifact pattern to match linter summaries'
    required: false
    default: 'linter-summary-*'
  title:
    description: 'Title for the summary report'
    required: false
    default: 'Code Quality & Linting Summary'
  show_metadata:
    description: 'Show workflow metadata (run number, branch, commit)'
    required: false
    default: 'true'
  show_stats:
    description: 'Show statistics about linter results'
    required: false
    default: 'true'
  post_pr_comment:
    description: 'Post combined summary as PR comment'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Download all linter summaries
      uses: actions/download-artifact@v6
      with:
        pattern: ${{ inputs.summary_pattern }}
        path: linter-summaries
        merge-multiple: true
      continue-on-error: true

    - name: Generate combined summary
      shell: bash
      run: |
        echo "## ${{ inputs.title }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Show metadata if enabled
        if [ "${{ inputs.show_metadata }}" = "true" ]; then
          echo "**Workflow Run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

          # Use head_ref for PRs (source branch), ref_name for pushes
          BRANCH_NAME="${{ github.head_ref }}"
          if [ -z "$BRANCH_NAME" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          echo "**Branch:** \`$BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY

          echo "**Commit:** [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Check if we have any linter summaries
        if [ -d "linter-summaries" ] && [ "$(ls -A linter-summaries 2>/dev/null)" ]; then
          LINTER_COUNT=$(find linter-summaries -name "*.md" -type f | wc -l)

          # Show stats if enabled
          if [ "${{ inputs.show_stats }}" = "true" ]; then
            echo "**Linters Executed:** $LINTER_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Linter Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Combine all linter summaries in alphabetical order
          for summary in $(find linter-summaries -name "*.md" -type f | sort); do
            if [ -f "$summary" ]; then
              cat "$summary" >> $GITHUB_STEP_SUMMARY
            fi
          done
        else
          echo "**No linter summaries found**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This could mean:" >> $GITHUB_STEP_SUMMARY
          echo "- No linters were executed" >> $GITHUB_STEP_SUMMARY
          echo "- Linter jobs failed before generating summaries" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts did not upload correctly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the job logs for more details." >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "_Generated by [Hardening Workflows](https://github.com/huntridge-labs/hardening-workflows)_" >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Comment PR with linting summary
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: actions/github-script@v8
      continue-on-error: true
      env:
        SUMMARY_TITLE: ${{ inputs.title }}
      with:
        script: |
          const fs = require('fs');

          console.log('Repository:', context.repo.owner + '/' + context.repo.repo);
          console.log('Event name:', context.eventName);
          console.log('PR number:', context.issue?.number);

          try {
            // Build comment body from all linter summaries
            let commentBody = `## ${process.env.SUMMARY_TITLE}\n\n<!-- linting-summary-comment-marker -->\n\n`;

            // Add metadata if available
            const branchName = process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME;
            if (branchName) {
              commentBody += `**Branch:** \`${branchName}\`\n`;
            }

            const shortSha = context.sha.substring(0, 7);
            commentBody += `**Commit:** [\`${shortSha}\`](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})\n`;
            commentBody += `**Workflow:** [#${context.runNumber}](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n`;

            // Check if we have linter summaries
            if (fs.existsSync('linter-summaries')) {
              const summaryFiles = fs.readdirSync('linter-summaries')
                .filter(f => f.endsWith('.md'))
                .sort();

              if (summaryFiles.length > 0) {
                commentBody += `**Linters Executed:** ${summaryFiles.length}\n\n`;
                commentBody += `### Linter Results\n\n`;

                // Combine all linter summaries
                for (const file of summaryFiles) {
                  const content = fs.readFileSync(`linter-summaries/${file}`, 'utf8');
                  commentBody += content + '\n';
                }
              } else {
                commentBody += '**No linter summaries found**\n\n';
                commentBody += 'Check the workflow logs for details.\n\n';
              }
            } else {
              commentBody += '**No linter results available**\n\n';
            }

            commentBody += `\n---\n_Generated by [Hardening Workflows](https://github.com/huntridge-labs/hardening-workflows)_`;

            // GitHub PR comment limit is 262,144 bytes
            const MAX_COMMENT_LENGTH = 262000;
            if (commentBody.length > MAX_COMMENT_LENGTH) {
              console.log(`Comment length (${commentBody.length}) exceeds limit, truncating...`);
              commentBody = commentBody.substring(0, MAX_COMMENT_LENGTH) + '\n\n... (report truncated, view full results in workflow artifacts)';
            }

            // Check for existing linting summary comments to update instead of creating new ones
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            console.log('Found', comments.data.length, 'existing comments');

            const existingComment = comments.data.find(comment => {
              const hasMarker = comment.body.includes('linting-summary-comment-marker');
              const isGitHubActions = comment.user.login === 'github-actions[bot]' || comment.user.type === 'Bot';
              console.log('Comment from', comment.user.login, 'type:', comment.user.type, 'has marker:', hasMarker);
              return hasMarker && isGitHubActions;
            });

            if (existingComment) {
              // Update existing comment with latest information
              console.log('Updating existing linting summary comment');
              const timestamp = new Date().toLocaleString();
              const updatedBody = commentBody + `\n\n---\n*Last updated: ${timestamp} | [View Run](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: updatedBody
              });
            } else {
              // Create new comment
              console.log('Creating new linting summary comment');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }

            console.log('Successfully posted/updated linting summary comment');
          } catch (error) {
            console.log('Failed to post linting summary comment:', error.message);
            console.log('Error status:', error.status);

            if (error.status === 403) {
              console.log('Permission denied - this can happen when:');
              console.log('   - Running on a fork (security restriction)');
              console.log('   - Missing pull-requests: write permission');
              console.log('   - Repository settings restrict PR comments');
            } else if (error.status === 404) {
              console.log('Resource not found - check if PR exists');
            }

            console.log('Linting summary is still available in workflow summary and artifacts');
          }

branding:
  icon: 'file-text'
  color: 'green'
