name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: All Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml

      - name: Install Node dependencies
        run: npm ci

      - name: Make bash tests executable
        run: chmod +x tests/unit/bash/*.sh

      - name: Run all tests
        run: npm test

      - name: Test Summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Coverage:**" >> $GITHUB_STEP_SUMMARY
          echo "- Bash tests (parsers & summary generators)" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript tests (config parsers)" >> $GITHUB_STEP_SUMMARY
          echo "- Python tests (utilities & ClamAV)" >> $GITHUB_STEP_SUMMARY
          echo "- Action schema validation (174 tests)" >> $GITHUB_STEP_SUMMARY
