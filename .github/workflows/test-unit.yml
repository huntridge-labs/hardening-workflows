name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    # Run on PRs to any branch

permissions:
  contents: read

jobs:
  unit-tests:
    name: All Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml

      - name: Install Node dependencies
        run: npm ci

      - name: Make bash tests executable
        run: chmod +x tests/unit/bash/*.sh

      - name: Run all tests
        run: npm test

      - name: Run tests with coverage
        run: |
          # JavaScript coverage (config parsers)
          npm run test:coverage:js
          
          # Python coverage (logistics scripts only - scanner scripts are being migrated to actions)
          pytest tests/unit/python/ --cov=.github/scripts/extract-archives --cov-report=lcov:coverage/python.lcov --cov-report=term -q || true

      - name: Coverage Report Summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # JavaScript coverage
          if [ -f coverage/js/lcov.info ]; then
            echo "### JavaScript Coverage" >> $GITHUB_STEP_SUMMARY
            npm run test:coverage:js 2>&1 | grep -A5 "All files" >> $GITHUB_STEP_SUMMARY || true
          fi

          # Python coverage
          if [ -f coverage/python.lcov ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Python Coverage" >> $GITHUB_STEP_SUMMARY
            pytest tests/unit/python/ --cov=.github/scripts/extract-archives --cov-report=term -q 2>&1 | grep -A10 "coverage:" >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Test Summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Coverage:**" >> $GITHUB_STEP_SUMMARY
          echo "- Bash tests (parsers & summary generators)" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript tests (config parsers)" >> $GITHUB_STEP_SUMMARY
          echo "- Python tests (utilities & ClamAV)" >> $GITHUB_STEP_SUMMARY
          echo "- Action schema validation (174 tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See detailed coverage reports in artifacts" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            htmlcov/
          retention-days: 30
