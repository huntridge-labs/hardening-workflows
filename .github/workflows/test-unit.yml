name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bash-unit-tests:
    name: Bash Script Tests
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y jq bash

      - name: Run Trivy parser tests
        run: |
          chmod +x tests/unit/bash/test-parse-trivy-results.sh
          ./tests/unit/bash/test-parse-trivy-results.sh

      - name: Run all bash unit tests
        shell: bash
        run: |
          EXIT_CODE=0
          for test_script in tests/unit/bash/test-*.sh; do
            if [[ -f "$test_script" ]]; then
              echo "========================================="
              echo "Running: $test_script"
              echo "========================================="
              chmod +x "$test_script"
              if ! "$test_script"; then
                echo "❌ FAILED: $test_script"
                EXIT_CODE=1
              else
                echo "✅ PASSED: $test_script"
              fi
              echo ""
            fi
          done
          exit $EXIT_CODE

  python-unit-tests:
    name: Python Script Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Python unit tests
        run: |
          if [ -d "tests/unit/python" ] && [ -n "$(ls -A tests/unit/python/test_*.py 2>/dev/null)" ]; then
            pytest tests/unit/python/ -v
          else
            echo "No Python unit tests found yet - skipping"
          fi

  javascript-unit-tests:
    name: JavaScript/Node Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: .github/scripts
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
          fi

      - name: Run JavaScript unit tests
        working-directory: .github/scripts
        run: |
          if [ -d "../../tests/unit/javascript" ] && [ -n "$(ls -A ../../tests/unit/javascript/*.test.js 2>/dev/null)" ]; then
            npm test
          else
            echo "No JavaScript unit tests found yet - skipping"
          fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [bash-unit-tests, python-unit-tests, javascript-unit-tests]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Bash Tests: ${{ needs.bash-unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python Tests: ${{ needs.python-unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript Tests: ${{ needs.javascript-unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
