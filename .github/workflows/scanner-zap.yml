name: ZAP DAST Scanner

# Direct ZAP scanning workflow - runs a single scan against a target.
# For config-driven multi-scan workflows, use scanner-zap-from-config.yml instead.
#
# Usage:
#   jobs:
#     zap:
#       uses: huntridge-labs/hardening-workflows/.github/workflows/scanner-zap.yml@main
#       with:
#         scan_type: baseline
#         target_url: 'http://127.0.0.1:8080'

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Target mode: url (already running), docker-run (run container), compose'
        required: false
        type: choice
        options:
          - url
          - docker-run
          - compose
        default: url
      scan_type:
        description: 'ZAP scan type: baseline, full, or api'
        required: false
        type: choice
        options:
          - baseline
          - full
          - api
        default: baseline
      target_url:
        description: 'Target URL for baseline/full scans'
        required: false
        type: string
        default: ''
      api_spec:
        description: 'OpenAPI/Swagger spec URL (for api scans)'
        required: false
        type: string
        default: ''
      app_image_ref:
        description: 'Container image (for docker-run mode)'
        required: false
        type: string
        default: ''
      app_ports:
        description: 'Port mappings (e.g., 8080:8080)'
        required: false
        type: string
        default: '8080:8080'
      max_duration_minutes:
        description: 'Max scan duration in minutes'
        required: false
        type: number
        default: 10
      fail_on_severity:
        description: 'Fail threshold: none, low, medium, high, critical'
        required: false
        type: string
        default: 'none'

  workflow_call:
    inputs:
      scan_name:
        description: 'Unique scan identifier (for artifact naming)'
        required: false
        type: string
        default: 'zap-scan'
      scan_mode:
        description: 'Target mode: url, docker-run, or compose'
        required: false
        type: string
        default: url
      scan_type:
        description: 'ZAP scan type: baseline, full, or api'
        required: false
        type: string
        default: baseline
      target_url:
        description: 'Target URL for baseline/full scans'
        required: false
        type: string
        default: ''
      api_spec:
        description: 'OpenAPI/Swagger spec URL (for api scans)'
        required: false
        type: string
        default: ''
      healthcheck_url:
        description: 'URL to poll until target is ready'
        required: false
        type: string
        default: ''
      app_image_ref:
        description: 'Container image (for docker-run mode)'
        required: false
        type: string
        default: ''
      app_build_context:
        description: 'Docker build context (for local builds)'
        required: false
        type: string
        default: ''
      app_dockerfile:
        description: 'Dockerfile path (for local builds)'
        required: false
        type: string
        default: ''
      app_image_tag:
        description: 'Tag for locally built image'
        required: false
        type: string
        default: ''
      app_ports:
        description: 'Port mappings (e.g., 8080:8080)'
        required: false
        type: string
        default: '8080:8080'
      compose_file:
        description: 'Docker compose file path'
        required: false
        type: string
        default: 'docker-compose.yml'
      compose_build:
        description: 'Run docker compose with --build'
        required: false
        type: boolean
        default: true
      max_duration_minutes:
        description: 'Max scan duration in minutes'
        required: false
        type: number
        default: 10
      rules_file_name:
        description: 'ZAP rules file to ignore alerts (.tsv)'
        required: false
        type: string
        default: ''
      cmd_options:
        description: 'Additional ZAP command-line options'
        required: false
        type: string
        default: ''
      fail_on_severity:
        description: 'Fail threshold: none, low, medium, high, critical'
        required: false
        type: string
        default: 'none'
      allow_failure:
        description: 'Continue workflow on scan failure'
        required: false
        type: boolean
        default: false
      post_pr_comment:
        description: 'Post results as PR comment'
        required: false
        type: boolean
        default: false
      hardening_workflows_ref:
        description: 'Git ref for hardening-workflows repo'
        required: false
        type: string
    secrets:
      registry_password:
        description: 'Registry password/token for private images'
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  HARDENING_WORKFLOWS_REPO_PATH: huntridge-labs/hardening-workflows
  HARDENING_WORKFLOWS_REF: feat/zap-scanner

jobs:
  zap-scan:
    name: ZAP ${{ inputs.scan_type }} scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          scan_type="${{ inputs.scan_type }}"
          target_url="${{ inputs.target_url }}"
          api_spec="${{ inputs.api_spec }}"

          if [[ "$scan_type" == "api" && -z "$api_spec" ]]; then
            echo "Error: api_spec is required for api scans"
            exit 1
          fi

          if [[ "$scan_type" != "api" && -z "$target_url" ]]; then
            echo "Error: target_url is required for $scan_type scans"
            exit 1
          fi

          # Generate artifact prefix
          scan_name="${{ inputs.scan_name }}"
          [[ -z "$scan_name" ]] && scan_name="zap-scan"
          name_hash=$(echo -n "$scan_name" | sha256sum | cut -c1-8)
          echo "artifact_prefix=${scan_type}-${name_hash}" >> "$GITHUB_OUTPUT"

          # Check if registry password is provided
          if [[ -n "$REGISTRY_PASSWORD" ]]; then
            echo "has_registry_password=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_registry_password=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}

      - name: Login to registry
        if: inputs.app_image_ref != '' && steps.validate.outputs.has_registry_password == 'true'
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.registry_password }}

      - name: Build target image
        if: inputs.scan_mode == 'docker-run' && inputs.app_build_context != ''
        run: |
          set -euo pipefail
          context="${{ inputs.app_build_context }}"
          dockerfile="${{ inputs.app_dockerfile }}"
          tag="${{ inputs.app_image_tag }}"

          if [[ -z "$tag" ]]; then
            tag="local-dast-app:${GITHUB_SHA}"
          fi

          echo "Building image '$tag' from '$dockerfile' (context: $context)"
          docker build -f "$dockerfile" -t "$tag" "$context"
          echo "ZAP_TARGET_IMAGE=$tag" >> "$GITHUB_ENV"

      - name: Start target (docker-run)
        if: inputs.scan_mode == 'docker-run'
        run: |
          set -euo pipefail

          image="${ZAP_TARGET_IMAGE:-${{ inputs.app_image_ref }}}"
          if [[ -z "$image" ]]; then
            echo "Error: app_image_ref required for docker-run mode"
            exit 1
          fi

          ports="${{ inputs.app_ports }}"
          [[ -z "$ports" ]] && ports="8080:8080"

          container_name="zap-target-${GITHUB_RUN_ID}"
          echo "Starting container '$container_name' from '$image'"

          port_args=()
          IFS=',' read -ra mappings <<< "$ports"
          for m in "${mappings[@]}"; do
            m="${m// /}"
            [[ -z "$m" ]] && continue
            port_args+=( -p "$m" )
          done

          docker run -d --rm --name "$container_name" "${port_args[@]}" "$image"
          echo "APP_CONTAINER_NAME=$container_name" >> "$GITHUB_ENV"

      - name: Start target (compose)
        if: inputs.scan_mode == 'compose'
        run: |
          set -euo pipefail
          file="${{ inputs.compose_file }}"
          if [[ ! -f "$file" ]]; then
            echo "Error: compose_file '$file' not found"
            exit 1
          fi

          echo "Starting docker compose from $file"
          if [[ "${{ inputs.compose_build }}" == "true" ]]; then
            docker compose -f "$file" up -d --build
          else
            docker compose -f "$file" up -d
          fi

      - name: Wait for target readiness
        run: |
          set -euo pipefail

          url="${{ inputs.healthcheck_url }}"
          if [[ -z "$url" ]]; then
            url="${{ inputs.target_url }}"
          fi

          if [[ -z "$url" ]]; then
            echo "No readiness URL, skipping"
            exit 0
          fi

          echo "Waiting for: $url"
          end=$((SECONDS + 180))
          while [[ $SECONDS -lt $end ]]; do
            if curl -fsS --max-time 3 "$url" >/dev/null 2>&1; then
              echo "Target is ready"
              exit 0
            fi
            sleep 3
          done

          echo "Timed out waiting for $url"
          exit 1

      - name: Build ZAP options
        id: zap_opts
        run: |
          max_dur="${{ inputs.max_duration_minutes }}"
          [[ -z "$max_dur" ]] && max_dur="10"
          extra_opts="${{ inputs.cmd_options }}"

          cmd_opts="-T ${max_dur}"
          [[ -n "$extra_opts" ]] && cmd_opts="$cmd_opts $extra_opts"

          echo "cmd_options=$cmd_opts" >> "$GITHUB_OUTPUT"

      - name: Run ZAP (baseline)
        if: inputs.scan_type == 'baseline'
        uses: zaproxy/action-baseline@v0.15.0
        with:
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-reports-${{ steps.validate.outputs.artifact_prefix }}
          target: ${{ inputs.target_url }}
          rules_file_name: ${{ inputs.rules_file_name }}
          cmd_options: ${{ steps.zap_opts.outputs.cmd_options }}

      - name: Run ZAP (full)
        if: inputs.scan_type == 'full'
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-reports-${{ steps.validate.outputs.artifact_prefix }}
          target: ${{ inputs.target_url }}
          rules_file_name: ${{ inputs.rules_file_name }}
          cmd_options: ${{ steps.zap_opts.outputs.cmd_options }}

      - name: Run ZAP (api)
        if: inputs.scan_type == 'api'
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-reports-${{ steps.validate.outputs.artifact_prefix }}
          format: openapi
          target: ${{ inputs.api_spec }}
          rules_file_name: ${{ inputs.rules_file_name }}
          cmd_options: ${{ steps.zap_opts.outputs.cmd_options }}

      - name: Enforce severity threshold
        if: always() && inputs.fail_on_severity != 'none' && inputs.fail_on_severity != ''
        continue-on-error: ${{ inputs.allow_failure == true }}
        shell: bash
        run: |
          set -euo pipefail

          report="report_json.json"
          if [[ ! -f "$report" ]]; then
            echo "No ZAP JSON report found"
            exit 0
          fi

          # ZAP risk codes: 3=High, 2=Medium, 1=Low, 0=Informational
          zap_high=$(jq -r '[..|objects|select(has("riskcode"))|.riskcode|tonumber] | map(select(.==3)) | length' "$report" 2>/dev/null || echo "0")
          zap_med=$(jq -r '[..|objects|select(has("riskcode"))|.riskcode|tonumber] | map(select(.==2)) | length' "$report" 2>/dev/null || echo "0")
          zap_low=$(jq -r '[..|objects|select(has("riskcode"))|.riskcode|tonumber] | map(select(.==1)) | length' "$report" 2>/dev/null || echo "0")

          fail_on="${{ inputs.fail_on_severity }}"
          echo "ZAP alerts: High=$zap_high Medium=$zap_med Low=$zap_low (threshold: $fail_on)"

          should_fail=false
          case "$fail_on" in
            low) [[ $((zap_high+zap_med+zap_low)) -gt 0 ]] && should_fail=true ;;
            medium) [[ $((zap_high+zap_med)) -gt 0 ]] && should_fail=true ;;
            high|critical) [[ $zap_high -gt 0 ]] && should_fail=true ;;
          esac

          if [[ "$should_fail" == "true" ]]; then
            echo "ZAP findings at or above '$fail_on' detected"
            exit 1
          fi
          echo "No findings at or above '$fail_on'"

      - name: Stop target (docker-run)
        if: always() && inputs.scan_mode == 'docker-run'
        run: |
          if [[ -n "${APP_CONTAINER_NAME:-}" ]]; then
            docker stop "$APP_CONTAINER_NAME" || true
          fi

      - name: Stop target (compose)
        if: always() && inputs.scan_mode == 'compose'
        run: |
          file="${{ inputs.compose_file }}"
          if [[ -f "$file" ]]; then
            docker compose -f "$file" down -v || true
          fi

      - name: Checkout hardening-workflows scripts
        if: always()
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HARDENING_WORKFLOWS_REPO_PATH }}
          ref: ${{ inputs.hardening_workflows_ref || env.HARDENING_WORKFLOWS_REF }}
          path: .hardening-workflows
          token: ${{ github.token }}
          sparse-checkout: |
            .github/scripts/parse-zap-results.sh
            .github/scripts/generate-zap-summary.sh

      - name: Generate scan summary
        if: always()
        env:
          ZAP_PARSER: .hardening-workflows/.github/scripts/parse-zap-results.sh
        run: |
          set -euo pipefail

          # Create zap-downloads structure expected by summary script
          mkdir -p "zap-downloads/zap-reports-${{ steps.validate.outputs.artifact_prefix }}"
          if [[ -f "report_json.json" ]]; then
            cp report_json.json "zap-downloads/zap-reports-${{ steps.validate.outputs.artifact_prefix }}/"
          fi

          chmod +x "$ZAP_PARSER" .hardening-workflows/.github/scripts/generate-zap-summary.sh
          .hardening-workflows/.github/scripts/generate-zap-summary.sh

      - name: Upload scan summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-summary-zap-${{ steps.validate.outputs.artifact_prefix }}
          path: scanner-summaries/zap.md
          retention-days: 30

      - name: Comment PR with ZAP summary
        if: github.event_name == 'pull_request' && inputs.post_pr_comment == true
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');

            try {
              const reportPath = 'scanner-summaries/zap.md';
              if (!fs.existsSync(reportPath)) {
                console.log('No summary file found');
                return;
              }

              let report = fs.readFileSync(reportPath, 'utf8');
              const MAX_LENGTH = 262000;
              if (report.length > MAX_LENGTH) {
                report = report.slice(0, MAX_LENGTH - 200) + '\n\n*Truncated due to size.*';
              }

              report = report
                .replace(/<details><summary>.*?<\/summary>\n*/, '')
                .replace(/<\/details>\s*$/, '')
                .trim();

              const scanType = '${{ inputs.scan_type }}';
              const scanTypeDisplay = scanType === 'baseline' ? 'Baseline' :
                                       scanType === 'full' ? 'Full Scan' :
                                       scanType === 'api' ? 'API Scan' : scanType;

              const MARKER = 'zap-dast-comment-${{ steps.validate.outputs.artifact_prefix }}';
              const body = `## ZAP DAST - ${scanTypeDisplay}\n\n<!-- ${MARKER} -->\n\n${report}`;

              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });

              const existing = comments.data.find(c =>
                c.body && c.body.includes(MARKER) &&
                (c.user.login === 'github-actions[bot]' || c.user.type === 'Bot')
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: body + `\n\n---\n*Updated: ${new Date().toLocaleString()} | [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            } catch (error) {
              console.log('Failed to post comment:', error.message);
            }
