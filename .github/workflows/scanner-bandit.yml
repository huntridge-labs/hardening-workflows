# Bandit Python Security Scanner - Reusable Workflow
#
# THIN WRAPPER: This workflow delegates to the scanner-bandit composite action.
# All scanning logic is in: .github/actions/scanner-bandit/action.yml
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/sast-only.yml

name: Bandit Python Security Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: true
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if any issue is found. Bandit does not support severity-based filtering - any value other than "none" will fail on any found issue.'
        required: false
        type: string
        default: 'none'
      python_version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.12'
    secrets:
      HARDENING_WORKFLOWS_CHECKOUT_TOKEN:
        description: 'Token for checking out hardening-workflows repo (required for private GHE servers)'
        required: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  # Use current branch/PR when testing in hardening-workflows repo, otherwise use release tag
  HRL_REF: ${{ github.repository == 'huntridge-labs/hardening-workflows' && (github.head_ref || github.ref_name) || '2.12.0' }}

jobs:
  bandit-analysis:
    name: Bandit Python Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout hardening-workflows for action
        if: github.repository != 'huntridge-labs/hardening-workflows'
        uses: actions/checkout@v6
        with:
          repository: huntridge-labs/hardening-workflows
          ref: ${{ env.HRL_REF }}
          path: .hardening-workflows
          token: ${{ secrets.HARDENING_WORKFLOWS_CHECKOUT_TOKEN || github.token }}
          sparse-checkout: |
            .github/actions/scanner-bandit

      - name: Run Bandit Scanner (local)
        if: github.repository == 'huntridge-labs/hardening-workflows'
        uses: ./.github/actions/scanner-bandit
        with:
          post_pr_comment: ${{ inputs.post_pr_comment }}
          enable_code_security: ${{ inputs.enable_code_security }}
          fail_on_severity: ${{ inputs.fail_on_severity }}
          python_version: ${{ inputs.python_version }}

      - name: Run Bandit Scanner (external)
        if: github.repository != 'huntridge-labs/hardening-workflows'
        uses: ./.hardening-workflows/.github/actions/scanner-bandit
        with:
          post_pr_comment: ${{ inputs.post_pr_comment }}
          enable_code_security: ${{ inputs.enable_code_security }}
          fail_on_severity: ${{ inputs.fail_on_severity }}
          python_version: ${{ inputs.python_version }}
