name: Bandit Python Security Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: true
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if any issue is found. Bandit does not support severity-based filtering - any value other than "none" will fail on any found issue.'
        required: false
        type: string
        default: 'none'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  bandit-analysis:
    name: Bandit Python Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install 'bandit[toml,sarif]>=1.7.5'

    - name: Run Bandit Security Scan
      run: |
        echo "🔍 Running Bandit Python security analysis..."
        mkdir -p bandit-reports

        # Determine exit-zero flag based on fail_on_severity
        EXIT_ZERO_FLAG=""
        if [ "${{ inputs.fail_on_severity }}" == "none" ] || [ -z "${{ inputs.fail_on_severity }}" ]; then
          EXIT_ZERO_FLAG="--exit-zero"
        fi

        echo "Generating SARIF report..."
        bandit -r . --exclude .husky,.github -f sarif -o bandit-reports/bandit-report.sarif $EXIT_ZERO_FLAG || true

        echo "Generating JSON report..."
        bandit -r . --exclude .husky,.github -f json -o bandit-reports/bandit-report.json $EXIT_ZERO_FLAG || true

        echo "Generating text report..."
        bandit -r . --exclude .husky,.github -f txt -o bandit-reports/bandit-report.txt $EXIT_ZERO_FLAG || true

        echo "Generated Bandit files:"
        ls -la bandit-reports/

    - name: Check severity threshold
      if: inputs.fail_on_severity != 'none' && inputs.fail_on_severity != ''
      run: |
        echo "🔍 Checking Bandit findings against severity threshold: ${{ inputs.fail_on_severity }}"

        if [ ! -f "bandit-reports/bandit-report.json" ]; then
          echo "⚠️ No Bandit JSON report found, skipping severity check"
          exit 0
        fi

        # Parse severity counts from JSON report
        HIGH_COUNT=$(jq -r '.results[] | select(.issue_severity == "HIGH") | .test_id' bandit-reports/bandit-report.json 2>/dev/null | wc -l | tr -d ' ')
        MEDIUM_COUNT=$(jq -r '.results[] | select(.issue_severity == "MEDIUM") | .test_id' bandit-reports/bandit-report.json 2>/dev/null | wc -l | tr -d ' ')
        LOW_COUNT=$(jq -r '.results[] | select(.issue_severity == "LOW") | .test_id' bandit-reports/bandit-report.json 2>/dev/null | wc -l | tr -d ' ')

        echo "Found: HIGH=$HIGH_COUNT, MEDIUM=$MEDIUM_COUNT, LOW=$LOW_COUNT"

        SHOULD_FAIL=false
        case "${{ inputs.fail_on_severity }}" in
          critical)
            # Bandit only has HIGH/MEDIUM/LOW - no critical severity exists
            # Treat HIGH as the equivalent of critical for Bandit
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "ℹ️ Bandit does not have 'critical' severity - treating HIGH as equivalent"
              echo "❌ Found $HIGH_COUNT high severity issues (Bandit's highest level)"
              SHOULD_FAIL=true
            fi
            ;;
          high)
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "❌ Found $HIGH_COUNT high severity issues"
              SHOULD_FAIL=true
            fi
            ;;
          medium)
            if [ "$HIGH_COUNT" -gt 0 ] || [ "$MEDIUM_COUNT" -gt 0 ]; then
              echo "❌ Found $HIGH_COUNT high and $MEDIUM_COUNT medium severity issues"
              SHOULD_FAIL=true
            fi
            ;;
          low)
            if [ "$HIGH_COUNT" -gt 0 ] || [ "$MEDIUM_COUNT" -gt 0 ] || [ "$LOW_COUNT" -gt 0 ]; then
              echo "❌ Found $HIGH_COUNT high, $MEDIUM_COUNT medium, and $LOW_COUNT low severity issues"
              SHOULD_FAIL=true
            fi
            ;;
        esac

        if [ "$SHOULD_FAIL" = true ]; then
          exit 1
        fi

        echo "✅ No issues at or above severity threshold"

    - name: Upload Bandit artifacts
      uses: actions/upload-artifact@v5
      with:
        name: bandit-reports
        path: bandit-reports/
        retention-days: 30
      if: always()

    - name: Upload Bandit SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: bandit-report.sarif
      if: inputs.enable_code_security == true && always() && github.actor != 'nektos/act' && hashFiles('bandit-report.sarif') != ''
      continue-on-error: true

    - name: Generate Bandit summary section
      if: always()
      run: |
        mkdir -p scanner-summaries

        echo "<details>" > scanner-summaries/bandit.md
        echo "<summary>🔍 Bandit</summary>" >> scanner-summaries/bandit.md
        echo "" >> scanner-summaries/bandit.md

        if [ -d "bandit-reports" ] && [ "$(ls -A bandit-reports)" ]; then
          echo "**Status:** ✅ Completed" >> scanner-summaries/bandit.md
          echo "" >> scanner-summaries/bandit.md

          # Try to use JSON report first (more reliable for Bandit)
          if [ -f "bandit-reports/bandit-report.json" ] && command -v jq >/dev/null 2>&1; then
            # Parse from JSON format which has clear severity fields
            HIGH_COUNT=$(jq -r '.results[] | select(.issue_severity == "HIGH") | .test_id' bandit-reports/bandit-report.json 2>/dev/null | wc -l | tr -d ' ')
            MEDIUM_COUNT=$(jq -r '.results[] | select(.issue_severity == "MEDIUM") | .test_id' bandit-reports/bandit-report.json 2>/dev/null | wc -l | tr -d ' ')
            LOW_COUNT=$(jq -r '.results[] | select(.issue_severity == "LOW") | .test_id' bandit-reports/bandit-report.json 2>/dev/null | wc -l | tr -d ' ')
            ISSUE_COUNT=$((HIGH_COUNT + MEDIUM_COUNT + LOW_COUNT))
          else
            # Fallback to SARIF parsing
            # Bandit SARIF maps: HIGH -> error, MEDIUM -> warning, LOW -> note
            ISSUE_COUNT=0
            HIGH_COUNT=0
            MEDIUM_COUNT=0
            LOW_COUNT=0

            for sarif_file in $(find ./bandit-reports -name "*.sarif" -type f 2>/dev/null); do
              if [ -f "$sarif_file" ] && [ -s "$sarif_file" ] && command -v jq >/dev/null 2>&1; then
                issues=$(jq -r '.runs[]?.results[]? | .ruleId' "$sarif_file" 2>/dev/null | wc -l | tr -d ' ')
                ISSUE_COUNT=$((ISSUE_COUNT + issues))

                high=$(jq -r '.runs[]?.results[]? | select(.level == "error") | .ruleId' "$sarif_file" 2>/dev/null | wc -l | tr -d ' ')
                HIGH_COUNT=$((HIGH_COUNT + high))

                medium=$(jq -r '.runs[]?.results[]? | select(.level == "warning") | .ruleId' "$sarif_file" 2>/dev/null | wc -l | tr -d ' ')
                MEDIUM_COUNT=$((MEDIUM_COUNT + medium))

                low=$(jq -r '.runs[]?.results[]? | select(.level == "note") | .ruleId' "$sarif_file" 2>/dev/null | wc -l | tr -d ' ')
                LOW_COUNT=$((LOW_COUNT + low))
              fi
            done
          fi

          echo "**Issues Found:** $ISSUE_COUNT" >> scanner-summaries/bandit.md
          echo "" >> scanner-summaries/bandit.md

          if [ $ISSUE_COUNT -gt 0 ]; then
            echo "| Severity | Count |" >> scanner-summaries/bandit.md
            echo "|----------|-------|" >> scanner-summaries/bandit.md
            [ $HIGH_COUNT -gt 0 ] && echo "| 🔴 High | $HIGH_COUNT |" >> scanner-summaries/bandit.md
            [ $MEDIUM_COUNT -gt 0 ] && echo "| 🟠 Medium | $MEDIUM_COUNT |" >> scanner-summaries/bandit.md
            [ $LOW_COUNT -gt 0 ] && echo "| 🟢 Low | $LOW_COUNT |" >> scanner-summaries/bandit.md
            echo "" >> scanner-summaries/bandit.md
          fi

          echo "**📁 Artifacts:** [Bandit Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> scanner-summaries/bandit.md
        else
          echo "**Status:** ⏭️ Skipped" >> scanner-summaries/bandit.md
        fi

        echo "" >> scanner-summaries/bandit.md
        echo "</details>" >> scanner-summaries/bandit.md
        echo "" >> scanner-summaries/bandit.md
      continue-on-error: true

    - name: Upload Bandit summary section
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: scanner-summary-bandit
        path: scanner-summaries/bandit.md
        retention-days: 7
      continue-on-error: true
