name: Test Container Scan from Config

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/container-scan-from-config.yml'
      - '.github/workflows/container-scan.yml'
      - '.github/actions/container-scanners/**'
      - '.github/scripts/parse-container-config.js'
      - '.github/schemas/container-config.schema.json'
      - 'examples/container-config.example.yml'
      - '.github/workflows/test-container-scan-from-config.yml'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  # Test 1: Validate config parsing
  test-parse-config:
    name: Test Config Parsing
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      has_containers: ${{ steps.parse.outputs.has_containers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-save js-yaml ajv

      - name: Parse and validate config
        id: parse
        env:
          CONFIG_FILE: 'examples/container-config.example.yml'
          SCHEMA_FILE: '.github/schemas/container-config.schema.json'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.actor }}
        run: |
          node .github/scripts/parse-container-config.js

          if [ -f "$GITHUB_OUTPUT" ]; then
            MATRIX=$(grep "^matrix=" "$GITHUB_OUTPUT" | cut -d= -f2-)
            if [ -n "$MATRIX" ] && [ "$MATRIX" != "{}" ] && [ "$MATRIX" != '{"include":[]}' ]; then
              echo "has_containers=true" >> $GITHUB_OUTPUT
              echo "✅ Parsed matrix: $MATRIX"
            else
              echo "has_containers=false" >> $GITHUB_OUTPUT
              echo "❌ No containers found in config"
            fi
          else
            echo "has_containers=false" >> $GITHUB_OUTPUT
          fi

  # Test 2: Test container-scan.yml with remote mode using local workflow
  test-remote-scan:
    name: Scan ${{ matrix.name }}
    needs: test-parse-config
    if: needs.test-parse-config.outputs.has_containers == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.test-parse-config.outputs.matrix) }}
    uses: ./.github/workflows/container-scan.yml
    with:
      scan_mode: 'remote'
      image_ref: ${{ matrix.image }}
      container_name: ${{ matrix.name }}
      registry_username: ${{ matrix.registry_username }}
      scanners: ${{ matrix.scanners }}
      allow_failure: ${{ matrix.allow_failure || false }}
      fail_on_severity: ${{ matrix.fail_on_severity || 'none' }}
      enable_code_security: false
      post_pr_comment: false
    secrets:
      registry_password: ${{ secrets[matrix.registry_auth_secret] }}

  # Test 3: Validate results
  test-summary:
    name: Validate Test Results
    runs-on: ubuntu-latest
    needs: [test-parse-config, test-remote-scan]
    if: always()
    steps:
      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: container-scan-results-*
          merge-multiple: true

      - name: Validate scan completed
        run: |
          echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for expected artifacts
          if ls container-summary-*.md 1>/dev/null 2>&1; then
            echo "✅ Scan summaries generated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for f in container-summary-*.md; do
              echo "## $(basename $f .md)" >> $GITHUB_STEP_SUMMARY
              cat "$f" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "⚠️ No scan summaries found" >> $GITHUB_STEP_SUMMARY
          fi

          # Check for SARIF files (vulnerability results)
          if ls trivy-*-results.sarif 1>/dev/null 2>&1; then
            echo "✅ Trivy SARIF results generated" >> $GITHUB_STEP_SUMMARY
          fi

          if ls grype-*-results.sarif 1>/dev/null 2>&1; then
            echo "✅ Grype SARIF results generated" >> $GITHUB_STEP_SUMMARY
          fi
