name: Test ZAP Scanner

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scanner-zap.yml'
      - '.github/workflows/test-zap.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # Test 1: Simple container scan using podinfo (docker-run mode with prebuilt image)
  test-zap-podinfo:
    name: Test ZAP - Podinfo (docker-run)
    uses: ./.github/workflows/scanner-zap.yml
    with:
      scan_mode: docker-run
      app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      app_ports: '9898:9898'
      target_urls: 'http://127.0.0.1:9898'
      healthcheck_url: 'http://127.0.0.1:9898/healthz'
      zap_scan_type: baseline
      zap_max_duration_minutes: 5
      allow_failure: false
      fail_on_severity: 'none'
      post_pr_comment: false

  # Test 2: URL-only mode (assumes target is already running - skipped in CI, useful for local/manual)
  # test-zap-url-only:
  #   name: Test ZAP - URL Only
  #   uses: ./.github/workflows/scanner-zap.yml
  #   with:
  #     scan_mode: url
  #     target_urls: 'https://example.com'
  #     zap_scan_type: baseline
  #     zap_max_duration_minutes: 2
  #     fail_on_severity: 'none'

  # Test 3: Multiple targets (matrix scan)
  test-zap-multi-target:
    name: Test ZAP - Multi-target
    uses: ./.github/workflows/scanner-zap.yml
    with:
      scan_mode: docker-run
      app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      app_ports: '9898:9898,9999:9898'
      target_urls: 'http://127.0.0.1:9898,http://127.0.0.1:9999'
      healthcheck_url: 'http://127.0.0.1:9898/healthz'
      zap_scan_type: baseline
      zap_max_duration_minutes: 3
      allow_failure: false
      fail_on_severity: 'none'
      post_pr_comment: false

  # Test 4: API scan against podinfo's swagger endpoint
  test-zap-api-scan:
    name: Test ZAP - API Scan
    uses: ./.github/workflows/scanner-zap.yml
    with:
      scan_mode: docker-run
      app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      app_ports: '9898:9898'
      zap_scan_type: api
      zap_api_spec: 'http://127.0.0.1:9898/swagger.json'
      healthcheck_url: 'http://127.0.0.1:9898/healthz'
      zap_max_duration_minutes: 5
      allow_failure: false
      fail_on_severity: 'none'
      post_pr_comment: false
