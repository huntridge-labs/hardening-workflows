name: Test ZAP Scanner

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/scanner-zap/**'
      - '.github/actions/scanner-zap-summary/**'
      - '.github/actions/parse-zap-config/**'
      - '.github/workflows/scanner-zap.yml'
      - '.github/workflows/scanner-zap-from-config.yml'
      - '.github/scripts/parse-zap-config.js'
      - '.github/schemas/zap-config.schema.json'
      - '.github/workflows/test-zap.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  security-events: write

jobs:
  # Test 1: Direct scanner call - simple baseline scan
  test-direct-baseline:
    name: Test Direct - Baseline
    uses: ./.github/workflows/scanner-zap.yml
    with:
      scan_mode: docker-run
      scan_type: baseline
      app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      app_ports: '9898:9898'
      target_url: 'http://127.0.0.1:9898'
      healthcheck_url: 'http://127.0.0.1:9898/healthz'
      max_duration_minutes: 5
      fail_on_severity: 'none'
      post_pr_comment: false

  # Test 2: Direct scanner call - API scan
  test-direct-api:
    name: Test Direct - API Scan
    uses: ./.github/workflows/scanner-zap.yml
    with:
      scan_mode: docker-run
      scan_type: api
      app_image_ref: 'ghcr.io/stefanprodan/podinfo:latest'
      app_ports: '9898:9898'
      api_spec: 'http://127.0.0.1:9898/swagger.json'
      healthcheck_url: 'http://127.0.0.1:9898/healthz'
      max_duration_minutes: 5
      fail_on_severity: 'none'
      post_pr_comment: false

  # Test 3: Config-driven multi-scan workflow
  test-from-config:
    name: Test Config-Driven
    uses: ./.github/workflows/scanner-zap-from-config.yml
    with:
      config_file: 'examples/zap-config.example.yml'
    secrets: inherit
