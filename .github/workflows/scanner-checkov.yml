name: Checkov Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      iac_path:
        description: 'Relative path to the infrastructure-as-code directory to scan'
        required: false
        type: string
        default: 'infrastructure'
      framework:
        description: 'IaC framework to scan (terraform, cloudformation, kubernetes, etc.)'
        required: false
        type: string
        default: 'terraform'
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if any check fails. Checkov does not support severity-based filtering - any value other than "none" will fail on any failed check.'
        required: false
        type: string
        default: 'none'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  checkov-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Validate scan directory
      id: validate
      run: |
        IAC_PATH="${{ inputs.iac_path }}"
        if [ -z "$IAC_PATH" ]; then
          IAC_PATH='infrastructure'
        fi

        if [ ! -d "$IAC_PATH" ]; then
          echo "⚠️  Directory '$IAC_PATH' not found. Skipping Checkov scan."
          echo "has_iac=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "has_iac=true" >> $GITHUB_OUTPUT
        echo "iac_path=$IAC_PATH" >> $GITHUB_OUTPUT
        echo "✅ Found IaC directory: $IAC_PATH"

        mkdir -p "$IAC_PATH"/security-reports
        echo "📁 Created security reports directory"

    - name: Run Checkov Infrastructure Scan
      if: steps.validate.outputs.has_iac == 'true'
      uses: bridgecrewio/checkov-action@v12.3079.0
      with:
        directory: ${{ steps.validate.outputs.iac_path }}
        framework: ${{ inputs.framework }}
        output_format: sarif,json,cli
        output_file_path: ${{ steps.validate.outputs.iac_path }}/security-reports/checkov-results.sarif,${{ steps.validate.outputs.iac_path }}/security-reports/checkov-results.json,${{ steps.validate.outputs.iac_path }}/security-reports/checkov-results.txt
        # soft_fail: true means don't fail, soft_fail: false means fail on issues
        soft_fail: ${{ inputs.fail_on_severity == 'none' || inputs.fail_on_severity == '' }}
      # Only continue-on-error when not enforcing severity threshold
      continue-on-error: ${{ inputs.fail_on_severity == 'none' || inputs.fail_on_severity == '' }}

    - name: Upload Checkov SARIF results to GitHub Security
      if: inputs.enable_code_security == true && steps.validate.outputs.has_iac == 'true' && always() && github.actor != 'nektos/act'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.validate.outputs.iac_path }}/security-reports/checkov-results.sarif
        category: checkov
      continue-on-error: true

    - name: Analyze Checkov results
      if: steps.validate.outputs.has_iac == 'true' && always()
      run: |
        IAC_PATH="${{ steps.validate.outputs.iac_path }}"
        JSON_FILE="$IAC_PATH/security-reports/checkov-results.json"

        if [ ! -f "$JSON_FILE" ]; then
          echo "⚠️  No Checkov results found"
          exit 0
        fi

        echo "📊 Checkov Security Analysis"
        echo "============================="

        # Checkov JSON format has different structure
        CRITICAL=$(jq '[.results.failed_checks[] | select(.severity == "CRITICAL")] | length' "$JSON_FILE" 2>/dev/null || echo "0")
        HIGH=$(jq '[.results.failed_checks[] | select(.severity == "HIGH")] | length' "$JSON_FILE" 2>/dev/null || echo "0")
        MEDIUM=$(jq '[.results.failed_checks[] | select(.severity == "MEDIUM")] | length' "$JSON_FILE" 2>/dev/null || echo "0")
        LOW=$(jq '[.results.failed_checks[] | select(.severity == "LOW")] | length' "$JSON_FILE" 2>/dev/null || echo "0")

        # If severity not available, count all failed checks
        if [ "$CRITICAL" == "0" ] && [ "$HIGH" == "0" ] && [ "$MEDIUM" == "0" ] && [ "$LOW" == "0" ]; then
          TOTAL=$(jq '.results.failed_checks | length' "$JSON_FILE" 2>/dev/null || echo "0")
          HIGH=$TOTAL
        else
          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
        fi

        PASSED=$(jq '.results.passed_checks | length' "$JSON_FILE" 2>/dev/null || echo "0")

        echo "🔍 Check Summary:"
        echo "  Critical: $CRITICAL"
        echo "  High: $HIGH"
        echo "  Medium: $MEDIUM"
        echo "  Low: $LOW"
        echo "  Passed: $PASSED"

        if [ "$TOTAL" -gt 0 ]; then
          echo "⚠️  Found $TOTAL failed checks"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::warning title=High Severity Issues::Found $CRITICAL critical and $HIGH high severity issues in IaC"
          fi
        else
          echo "✅ All checks passed"
        fi

    - name: Upload Checkov artifacts
      if: steps.validate.outputs.has_iac == 'true' && always()
      uses: actions/upload-artifact@v6
      with:
        name: checkov-scan-results
        path: |
          ${{ steps.validate.outputs.iac_path }}/security-reports/checkov-results.*
        retention-days: 30

    - name: Generate scanner summary section
      if: always()
      env:
        HEAD_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        mkdir -p scanner-summaries

        # Function to generate summary for a given output
        generate_checkov_summary() {
          local output="$1"
          local is_pr_comment="$2"

          if [ "$is_pr_comment" = "true" ]; then
            echo "<details>" >> "$output"
            echo "<summary>🏗️ Checkov IaC Security</summary>" >> "$output"
          else
            echo "## 🏗️ Checkov IaC Security Scan Summary" >> "$output"
          fi
          echo "" >> "$output"

          if [ "${{ steps.validate.outputs.has_iac }}" == "true" ]; then
            IAC_PATH="${{ steps.validate.outputs.iac_path }}"
            JSON_FILE="$IAC_PATH/security-reports/checkov-results.json"

            if [ -f "$JSON_FILE" ]; then
              if [ "$is_pr_comment" = "true" ]; then
                echo "**Status:** ✅ Completed" >> "$output"
                echo "" >> "$output"
              fi

              # Get counts from summary if available, otherwise count from results
              FAILED=$(jq -r '.summary.failed // 0' "$JSON_FILE" 2>/dev/null || echo "0")
              PASSED=$(jq -r '.summary.passed // 0' "$JSON_FILE" 2>/dev/null || echo "0")
              SKIPPED=$(jq -r '.summary.skipped // 0' "$JSON_FILE" 2>/dev/null || echo "0")
              CHECK_TYPE=$(jq -r '.check_type // "unknown"' "$JSON_FILE" 2>/dev/null || echo "unknown")

              # Overall Summary Table
              echo "### 📊 Check Summary" >> "$output"
              echo "" >> "$output"
              echo "| ❌ Failed | ✅ Passed | ⏭️ Skipped | 📦 Total |" >> "$output"
              echo "|-----------|-----------|------------|----------|" >> "$output"
              TOTAL=$((FAILED + PASSED + SKIPPED))
              echo "| **$FAILED** | **$PASSED** | **$SKIPPED** | **$TOTAL** |" >> "$output"
              echo "" >> "$output"

              echo "**Framework:** $CHECK_TYPE" >> "$output"
              echo "" >> "$output"

              # Priority messages
              if [ $FAILED -gt 0 ]; then
                echo "❌ **FAILED**: $FAILED IaC security checks failed and need attention" >> "$output"
                echo "" >> "$output"
              fi

              # Detailed findings with collapsible sections
              if [ $FAILED -gt 0 ]; then
                echo "<details open>" >> "$output"
                echo "<summary>🔍 Failed Check Details ($FAILED)</summary>" >> "$output"
                echo "" >> "$output"

                echo "| Check ID | Check Name | Resource | Location |" >> "$output"
                echo "|----------|------------|----------|----------|" >> "$output"

                # Extract failed checks with clickable file links
                # GitHub link format: https://github.com/{owner}/{repo}/blob/{branch}/{filepath}#L{start}-L{end}
                REPO_URL="https://github.com/${{ github.repository }}/blob/${HEAD_REF}"
                jq -r --arg repo_url "$REPO_URL" '.results.failed_checks[]? |
                  (.file_path // "N/A" | ltrimstr("/")) as $filepath |
                  (.file_line_range[0] // 1) as $start |
                  (.file_line_range[1] // 1) as $end |
                  "| \(.check_id // "N/A") | \(.check_name // "N/A" | .[0:50]) | \(.resource // "N/A" | .[0:40]) | [\($filepath)#L\($start)-L\($end)](\($repo_url)/\($filepath)#L\($start)-L\($end)) |"' "$JSON_FILE" >> "$output" 2>/dev/null || echo "| Error parsing results | - | - | - |" >> "$output"
                echo "" >> "$output"

                echo "</details>" >> "$output"
                echo "" >> "$output"
              elif [ $FAILED -eq 0 ] && [ $PASSED -gt 0 ]; then
                echo "✅ **All $PASSED security checks passed!**" >> "$output"
                echo "" >> "$output"
              fi

              echo "**📁 Artifacts:** [Checkov Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> "$output"
            else
              if [ "$is_pr_comment" = "true" ]; then
                echo "**Status:** ⚠️ No results generated" >> "$output"
              else
                echo "**Status:** ⚠️ No Checkov results available" >> "$output"
              fi
            fi
          else
            if [ "$is_pr_comment" = "true" ]; then
              echo "**Status:** ⏭️ Skipped (no IaC directory found)" >> "$output"
            else
              echo "**Status:** ⏭️ Skipped - no IaC directory found at '${{ inputs.iac_path }}'" >> "$output"
            fi
          fi

          if [ "$is_pr_comment" = "true" ]; then
            echo "" >> "$output"
            echo "</details>" >> "$output"
          fi
          echo "" >> "$output"
        }

        # Generate PR comment artifact
        generate_checkov_summary "scanner-summaries/checkov.md" "true"

        # Generate job summary
        generate_checkov_summary "$GITHUB_STEP_SUMMARY" "false"
      continue-on-error: true

    - name: Upload scanner summary section
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: scanner-summary-checkov
        path: scanner-summaries/checkov.md
        retention-days: 7
      continue-on-error: true
