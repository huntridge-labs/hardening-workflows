name: OpenGrep Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: true
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if vulnerabilities at or above this severity are found. Options: none, low, medium, high. Set to "none" to never fail.'
        required: false
        type: string
        default: 'none'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  opengrep-analysis:
    name: OpenGrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install OpenGrep
      run: |
        echo "🔧 Installing OpenGrep..."
        curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
        echo "$HOME/.opengrep/cli/latest" >> $GITHUB_PATH

    - name: Run OpenGrep Security Analysis
      run: |
        echo "🔍 Running OpenGrep comprehensive security analysis..."
        mkdir -p opengrep-reports
        opengrep scan --config=auto --sarif --output=opengrep-reports/opengrep.sarif . || true
        opengrep scan --config=auto --json --output=opengrep-reports/opengrep.json . || true
      continue-on-error: true

    - name: Check severity threshold
      if: inputs.fail_on_severity != 'none' && inputs.fail_on_severity != ''
      run: |
        FAIL_ON="${{ inputs.fail_on_severity }}"
        echo "🔍 Checking for vulnerabilities at or above severity: $FAIL_ON"

        if [ ! -f "opengrep-reports/opengrep.json" ]; then
          echo "⚠️  No OpenGrep JSON report found, skipping severity check"
          exit 0
        fi

        # OpenGrep uses ERROR, WARNING, INFO for severity levels
        ERROR_COUNT=$(jq -r '[.results[]? | select(.extra.severity == "ERROR")] | length' opengrep-reports/opengrep.json 2>/dev/null || echo "0")
        WARNING_COUNT=$(jq -r '[.results[]? | select(.extra.severity == "WARNING")] | length' opengrep-reports/opengrep.json 2>/dev/null || echo "0")
        INFO_COUNT=$(jq -r '[.results[]? | select(.extra.severity == "INFO")] | length' opengrep-reports/opengrep.json 2>/dev/null || echo "0")

        echo "📊 Severity counts: Error=$ERROR_COUNT, Warning=$WARNING_COUNT, Info=$INFO_COUNT"

        SHOULD_FAIL=false
        case "$FAIL_ON" in
          low)
            if [ "$INFO_COUNT" -gt 0 ] || [ "$WARNING_COUNT" -gt 0 ] || [ "$ERROR_COUNT" -gt 0 ]; then
              SHOULD_FAIL=true
            fi
            ;;
          medium)
            if [ "$WARNING_COUNT" -gt 0 ] || [ "$ERROR_COUNT" -gt 0 ]; then
              SHOULD_FAIL=true
            fi
            ;;
          high|critical)
            if [ "$ERROR_COUNT" -gt 0 ]; then
              SHOULD_FAIL=true
            fi
            ;;
        esac

        if [ "$SHOULD_FAIL" = "true" ]; then
          echo "❌ Found vulnerabilities at or above $FAIL_ON severity level"
          exit 1
        else
          echo "✅ No vulnerabilities at or above $FAIL_ON severity level"
        fi

    - name: Upload OpenGrep artifacts
      uses: actions/upload-artifact@v6
      with:
        name: opengrep-reports
        path: opengrep-reports/
        retention-days: 30
      if: always()

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: opengrep.sarif
      if: inputs.enable_code_security == true && always() && github.actor != 'nektos/act' && hashFiles('opengrep.sarif') != ''
      continue-on-error: true

    - name: Generate OpenGrep summary section
      if: always()
      env:
        HEAD_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        mkdir -p scanner-summaries

        # Function to generate summary for a given output
        generate_opengrep_summary() {
          local output="$1"
          local is_pr_comment="$2"

          if [ "$is_pr_comment" = "true" ]; then
            echo "<details>" >> "$output"
            echo "<summary>🔍 OpenGrep SAST</summary>" >> "$output"
          else
            echo "## 🔍 OpenGrep SAST Scan Summary" >> "$output"
          fi
          echo "" >> "$output"

          if [ -d "opengrep-reports" ] && [ "$(ls -A opengrep-reports 2>/dev/null)" ]; then
            if [ "$is_pr_comment" = "true" ]; then
              echo "**Status:** ✅ Completed" >> "$output"
              echo "" >> "$output"
            fi

            # Count issues from JSON files (OpenGrep uses JSON)
            ISSUE_COUNT=0
            ERROR_COUNT=0
            WARNING_COUNT=0
            INFO_COUNT=0

            json_file="opengrep-reports/opengrep.json"
            # Set up repo URL for clickable links
            REPO_URL="https://github.com/${{ github.repository }}/blob/${HEAD_REF}"

            if [ -f "$json_file" ] && [ -s "$json_file" ] && command -v jq >/dev/null 2>&1; then
              ISSUE_COUNT=$(jq -r '[.results[]?] | length' "$json_file" 2>/dev/null || echo "0")
              ERROR_COUNT=$(jq -r '[.results[]? | select(.extra.severity == "ERROR")] | length' "$json_file" 2>/dev/null || echo "0")
              WARNING_COUNT=$(jq -r '[.results[]? | select(.extra.severity == "WARNING")] | length' "$json_file" 2>/dev/null || echo "0")
              INFO_COUNT=$(jq -r '[.results[]? | select(.extra.severity == "INFO")] | length' "$json_file" 2>/dev/null || echo "0")
            fi

            # Overall Summary Table
            echo "### 📊 Findings Summary" >> "$output"
            echo "" >> "$output"
            echo "| 🔴 Error | 🟠 Warning | 🔵 Info | 📦 Total |" >> "$output"
            echo "|----------|------------|---------|----------|" >> "$output"
            echo "| **$ERROR_COUNT** | **$WARNING_COUNT** | **$INFO_COUNT** | **$ISSUE_COUNT** |" >> "$output"
            echo "" >> "$output"

            # Detailed findings with collapsible sections
            if [ $ISSUE_COUNT -gt 0 ] && [ -f "$json_file" ]; then
              echo "<details open>" >> "$output"
              echo "<summary>🔍 Finding Details</summary>" >> "$output"
              echo "" >> "$output"

              # Show Error findings first (expanded)
              if [ $ERROR_COUNT -gt 0 ]; then
                echo "<details>" >> "$output"
                echo "<summary>🔴 Error Findings ($ERROR_COUNT)</summary>" >> "$output"
                echo "" >> "$output"
                echo "| Rule ID | Location | Message |" >> "$output"
                echo "|---------|----------|---------|" >> "$output"
                jq -r --arg repo_url "$REPO_URL" '.results[]? | select(.extra.severity == "ERROR") | (.path // "N/A") as $file | (.start.line // 1) as $start | (.end.line // .start.line // 1) as $end | "| \(.check_id // "N/A" | split(".")[-1]) | [\($file)#L\($start)-L\($end)](\($repo_url)/\($file)#L\($start)-L\($end)) | \(.extra.message // .extra.metadata.message // "N/A" | gsub("\n"; " ") | .[0:80]) |"' "$json_file" 2>/dev/null | head -50 >> "$output" || echo "| Error parsing | - | - |" >> "$output"
                if [ $ERROR_COUNT -gt 50 ]; then
                  echo "" >> "$output"
                  echo "_...and $((ERROR_COUNT - 50)) more error findings_" >> "$output"
                fi
                echo "</details>" >> "$output"
                echo "" >> "$output"
              fi

              # Show Warning findings (expanded)
              if [ $WARNING_COUNT -gt 0 ]; then
                echo "<details>" >> "$output"
                echo "<summary>🟠 Warning Findings ($WARNING_COUNT)</summary>" >> "$output"
                echo "" >> "$output"
                echo "| Rule ID | Location | Message |" >> "$output"
                echo "|---------|----------|---------|" >> "$output"
                jq -r --arg repo_url "$REPO_URL" '.results[]? | select(.extra.severity == "WARNING") | (.path // "N/A") as $file | (.start.line // 1) as $start | (.end.line // .start.line // 1) as $end | "| \(.check_id // "N/A" | split(".")[-1]) | [\($file)#L\($start)-L\($end)](\($repo_url)/\($file)#L\($start)-L\($end)) | \(.extra.message // .extra.metadata.message // "N/A" | gsub("\n"; " ") | .[0:80]) |"' "$json_file" 2>/dev/null | head -50 >> "$output" || echo "| Error parsing | - | - |" >> "$output"
                if [ $WARNING_COUNT -gt 50 ]; then
                  echo "" >> "$output"
                  echo "_...and $((WARNING_COUNT - 50)) more warning findings_" >> "$output"
                fi
                echo "</details>" >> "$output"
                echo "" >> "$output"
              fi

              # Show Info findings in collapsed section
              if [ $INFO_COUNT -gt 0 ]; then
                echo "<details>" >> "$output"
                echo "<summary>🔵 Info Findings ($INFO_COUNT)</summary>" >> "$output"
                echo "" >> "$output"
                echo "| Rule ID | Location | Message |" >> "$output"
                echo "|---------|----------|---------|" >> "$output"
                jq -r --arg repo_url "$REPO_URL" '.results[]? | select(.extra.severity == "INFO") | (.path // "N/A") as $file | (.start.line // 1) as $start | (.end.line // .start.line // 1) as $end | "| \(.check_id // "N/A" | split(".")[-1]) | [\($file)#L\($start)-L\($end)](\($repo_url)/\($file)#L\($start)-L\($end)) | \(.extra.message // .extra.metadata.message // "N/A" | gsub("\n"; " ") | .[0:80]) |"' "$json_file" 2>/dev/null | head -50 >> "$output" || echo "| Error parsing | - | - |" >> "$output"
                if [ $INFO_COUNT -gt 50 ]; then
                  echo "" >> "$output"
                  echo "_...and $((INFO_COUNT - 50)) more info findings_" >> "$output"
                fi
                echo "" >> "$output"
                echo "</details>" >> "$output"
                echo "" >> "$output"
              fi

              echo "</details>" >> "$output"
              echo "" >> "$output"
            elif [ $ISSUE_COUNT -eq 0 ]; then
              echo "✅ **No security findings detected!**" >> "$output"
              echo "" >> "$output"
            fi

            echo "**📁 Artifacts:** [OpenGrep Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> "$output"
          else
            if [ "$is_pr_comment" = "true" ]; then
              echo "**Status:** ⏭️ Skipped" >> "$output"
            else
              echo "**Status:** ⏭️ No OpenGrep results available" >> "$output"
            fi
          fi

          if [ "$is_pr_comment" = "true" ]; then
            echo "" >> "$output"
            echo "</details>" >> "$output"
          fi
          echo "" >> "$output"
        }

        # Generate PR comment artifact
        generate_opengrep_summary "scanner-summaries/opengrep.md" "true"

        # Generate job summary
        generate_opengrep_summary "$GITHUB_STEP_SUMMARY" "false"
      continue-on-error: true

    - name: Upload OpenGrep summary section
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: scanner-summary-opengrep
        path: scanner-summaries/opengrep.md
        retention-days: 7
      continue-on-error: true
