# Validates .ai/ directory integrity
# Part of AICaC (AI Context as Code) specification
# Note: This workflow uses only static content and file operations, no untrusted input

name: Validate AI Context

on:
  pull_request:
    paths:
      - '.ai/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'docs/**'
      - 'version.yaml'

jobs:
  validate-ai-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .ai/ files exist
        run: |
          required_files=(
            ".ai/README.md"
            ".ai/context.yaml"
            ".ai/architecture.yaml"
            ".ai/workflows.yaml"
            ".ai/decisions.yaml"
            ".ai/errors.yaml"
          )

          missing=()
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              missing+=("$file")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required .ai/ files: ${missing[*]}"
            exit 1
          fi

          echo "✅ All required .ai/ files present"

      - name: Validate YAML syntax
        run: |
          for file in .ai/*.yaml; do
            echo "Validating $file..."
            if ! python3 -c "import yaml; yaml.safe_load(open('$file'))"; then
              echo "::error::Invalid YAML in $file"
              exit 1
            fi
          done
          echo "✅ All YAML files valid"

      - name: Check version consistency
        run: |
          # Get version from version.yaml
          VERSION=$(grep -oP 'version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' version.yaml || echo "unknown")

          # Check if .ai/context.yaml has same version
          AI_VERSION=$(grep -oP 'version:\s*"\K[0-9]+\.[0-9]+\.[0-9]+' .ai/context.yaml || echo "not-found")

          if [[ "$VERSION" != "$AI_VERSION" && "$AI_VERSION" != "not-found" ]]; then
            echo "::warning::Version mismatch - version.yaml: $VERSION, .ai/context.yaml: $AI_VERSION"
          else
            echo "✅ Version consistent: $VERSION"
          fi

      - name: Check for stale file references
        run: |
          stale=()

          # Check architecture.yaml component locations
          while IFS= read -r location; do
            # Skip empty lines and comments
            [[ -z "$location" || "$location" == \#* ]] && continue

            # Clean up the path
            path=$(echo "$location" | tr -d '"' | tr -d "'")

            # Skip glob patterns
            [[ "$path" == *"*"* ]] && continue

            # Check if path exists (file or directory)
            if [[ ! -e "$path" && ! -d "$path" ]]; then
              stale+=("$path")
            fi
          done < <(grep -oP 'location:\s*["'\''"]?\K[^"'\''\n]+' .ai/architecture.yaml 2>/dev/null || true)

          if [[ ${#stale[@]} -gt 0 ]]; then
            echo "::warning::Potentially stale file references in .ai/architecture.yaml:"
            printf '  - %s\n' "${stale[@]}"
          else
            echo "✅ No stale file references detected"
          fi

      - name: Output AI Context checklist
        run: |
          echo "## 📋 AI Context Checklist" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If this PR changes project structure, commands, or behavior:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Updated \`.ai/architecture.yaml\` (if structure changed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Updated \`.ai/workflows.yaml\` (if commands changed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Updated \`.ai/decisions.yaml\` (if design decision made)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Updated \`.ai/errors.yaml\` (if common error fixed)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See \`.ai/MAINTENANCE.md\` for details." >> "$GITHUB_STEP_SUMMARY"
