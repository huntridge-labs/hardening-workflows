name: Container Security Scanning

on:
  # Remove direct PR triggers since this workflow is called by reusable-security-hardening.yml
  # push:
  #   branches: [ main, develop ]
  #   paths:
  #     - '**/Dockerfile*'
  #     - '.github/workflows/container-scan.yml'
  # pull_request:
  #   branches: [ main, develop ]
  #   paths:
  #     - '**/Dockerfile*'
  #     - '.github/workflows/container-scan.yml'
  workflow_dispatch:  # Keep for manual testing
  workflow_call:      # Keep for reusable workflow calls from reusable-security-hardening.yml
    inputs:
      post_pr_comment:
        description: 'Whether to post PR comments (disabled when called from other workflows)'
        required: false
        type: boolean
        default: true
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if vulnerabilities at or above this severity are found. Options: none, low, medium, high, critical. Set to "none" to never fail.'
        required: false
        type: string
        default: 'none'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  # Discover containers in this repository
  discover-containers:
    name: Discover Container Images
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.discover.outputs.containers }}
      has_containers: ${{ steps.discover.outputs.has_containers }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Discover Dockerfiles in repository
      id: discover
      run: |
        echo "🔍 Discovering Dockerfiles in repository..."

        # Find all Dockerfiles in the repository
        DOCKERFILES=$(find . -name "Dockerfile*" -not -path "./.git/*" -type f)

        if [ -z "$DOCKERFILES" ]; then
          echo "ℹ️  No Dockerfiles found in repository"
          echo "has_containers=false" >> $GITHUB_OUTPUT
          echo "containers=[]" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "Found Dockerfiles:"
        echo "$DOCKERFILES"

        # Create JSON array of containers to scan
        containers="["
        first=true

        for dockerfile in $DOCKERFILES; do
          # Extract directory and create container info
          dir=$(dirname "$dockerfile")
          name=$(basename "$dir")

          # Handle special cases for naming
          if [[ "$dockerfile" == *"vulnerable"* ]]; then
            name="${name}-vulnerable"
          elif [[ "$dockerfile" == *"secure"* ]]; then
            name="${name}-secure"
          fi

          if [ "$first" = true ]; then
            first=false
          else
            containers="$containers,"
          fi

          containers="$containers{\"dockerfile\":\"$dockerfile\",\"name\":\"$name\",\"context\":\"$dir\"}"
        done

        containers="$containers]"

        echo "has_containers=true" >> $GITHUB_OUTPUT
        echo "containers=$containers" >> $GITHUB_OUTPUT

        echo "Container scan matrix:"
        echo "$containers" | jq '.'

  build-and-scan:
    name: Build and Scan Container Images
    runs-on: ubuntu-latest
    needs: discover-containers
    if: needs.discover-containers.outputs.has_containers == 'true'
    timeout-minutes: 30
    continue-on-error: true  # Allow pipeline to continue even if vulnerabilities found

    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.discover-containers.outputs.containers) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build container image
      id: build
      continue-on-error: true  # Don't fail if build has issues
      run: |
        # Generate image name and tag
        IMAGE_NAME="hardening-test-$(echo '${{ matrix.container.name }}' | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
        IMAGE_TAG="scan-$(echo $GITHUB_SHA | cut -c1-8)"
        FULL_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

        echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
        echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "full_image=$FULL_IMAGE" >> $GITHUB_OUTPUT

        echo "🔨 Building image: $FULL_IMAGE"
        echo "📄 Dockerfile: ${{ matrix.container.dockerfile }}"
        echo "📁 Context: ${{ matrix.container.context }}"

        # Build the image
        if docker build \
          --tag "$FULL_IMAGE" \
          --file "${{ matrix.container.dockerfile }}" \
          "${{ matrix.container.context }}"; then
          echo "✅ Successfully built image: $FULL_IMAGE"
          echo "build_success=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Failed to build image: $FULL_IMAGE"
          echo "build_success=false" >> $GITHUB_OUTPUT
          echo "::warning title=Build Failed::Failed to build ${{ matrix.container.name }} - this may be expected for vulnerable test containers"
        fi

    - name: Generate SBOM for built image (Syft)
      if: steps.build.outputs.build_success == 'true'
      uses: anchore/sbom-action@v0.20.10
      with:
        image: ${{ steps.build.outputs.full_image }}
        format: cyclonedx-json
        output-file: container-scan-results-sbom-${{ matrix.container.name }}.json

    - name: Upload SBOM Artifact
      if: steps.build.outputs.build_success == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: container-scan-results-sbom-${{ matrix.container.name }}
        path: container-scan-results-sbom-${{ matrix.container.name }}.json

    - name: Generate human-readable SBOM (table)
      if: steps.build.outputs.build_success == 'true'
      run: |
        syft ${{ steps.build.outputs.full_image }} -o table > container-scan-results-sbom-${{ matrix.container.name }}.txt

    - name: Upload human-readable SBOM Artifact
      if: steps.build.outputs.build_success == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: container-scan-results-sbom-table-${{ matrix.container.name }}
        path: container-scan-results-sbom-${{ matrix.container.name }}.txt

    - name: Run Trivy vulnerability scanner (SARIF)
      if: steps.build.outputs.build_success == 'true'
      uses: aquasecurity/trivy-action@0.33.1
      # Only continue-on-error when not enforcing severity threshold
      continue-on-error: ${{ inputs.fail_on_severity == 'none' || inputs.fail_on_severity == '' }}
      with:
        image-ref: ${{ steps.build.outputs.full_image }}
        format: 'sarif'
        output: 'trivy-${{ matrix.container.name }}-results.sarif'
        # Use native exit-code when severity threshold is set
        exit-code: ${{ inputs.fail_on_severity != 'none' && inputs.fail_on_severity != '' && '1' || '0' }}
        severity: ${{ inputs.fail_on_severity == 'critical' && 'CRITICAL' || inputs.fail_on_severity == 'high' && 'HIGH,CRITICAL' || inputs.fail_on_severity == 'medium' && 'MEDIUM,HIGH,CRITICAL' || inputs.fail_on_severity == 'low' && 'LOW,MEDIUM,HIGH,CRITICAL' || 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL' }}

    - name: Run Trivy vulnerability scanner (JSON)
      if: steps.build.outputs.build_success == 'true'
      uses: aquasecurity/trivy-action@0.33.1
      continue-on-error: true  # Never fail the pipeline
      with:
        image-ref: ${{ steps.build.outputs.full_image }}
        format: 'json'
        output: 'trivy-${{ matrix.container.name }}-results.json'

    - name: Run Trivy vulnerability scanner (Table)
      if: steps.build.outputs.build_success == 'true'
      uses: aquasecurity/trivy-action@0.33.1
      continue-on-error: true  # Never fail the pipeline
      with:
        image-ref: ${{ steps.build.outputs.full_image }}
        format: 'table'

    - name: Add vulnerability summary to job summary
      if: steps.build.outputs.build_success == 'true'
      run: |
        echo "## 🐳 Container Security Scan - ${{ matrix.container.name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ steps.build.outputs.full_image }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f "trivy-${{ matrix.container.name }}-results.json" ]; then
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-${{ matrix.container.name }}-results.json 2>/dev/null || echo "0")
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-${{ matrix.container.name }}-results.json 2>/dev/null || echo "0")
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-${{ matrix.container.name }}-results.json 2>/dev/null || echo "0")
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' trivy-${{ matrix.container.name }}-results.json 2>/dev/null || echo "0")
          UNIQUE=$(jq '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | map(select(. != null)) | unique | length' trivy-${{ matrix.container.name }}-results.json 2>/dev/null || echo "0")
          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))

          echo "### Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 🚨 Critical | ⚠️ High | 🟡 Medium | 🔵 Low | 📊 Total | 🔢 Unique |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|---------|-----------|---------|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| **$CRITICAL** | **$HIGH** | **$MEDIUM** | **$LOW** | **$TOTAL** | **$UNIQUE** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Generate detailed vulnerability table by severity
          if [ $TOTAL -gt 0 ]; then
            echo "<details open>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>🔍 Vulnerability Details</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Show Critical vulnerabilities first
            if [ $CRITICAL -gt 0 ]; then
              echo "#### 🚨 Critical Vulnerabilities ($CRITICAL)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| CVE | Severity | Package | Installed Version | Fixed Version |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|---------|-------------------|---------------|" >> $GITHUB_STEP_SUMMARY
              jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL") | "| \(.VulnerabilityID // "N/A") | 🚨 CRITICAL | \(.PkgName // "N/A") | \(.InstalledVersion // "N/A") | \(.FixedVersion // "Not Fixed") |"' "trivy-${{ matrix.container.name }}-results.json" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "| Error parsing | - | - | - | - |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # Show High vulnerabilities
            if [ $HIGH -gt 0 ]; then
              echo "#### ⚠️ High Vulnerabilities ($HIGH)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| CVE | Severity | Package | Installed Version | Fixed Version |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|---------|-------------------|---------------|" >> $GITHUB_STEP_SUMMARY
              jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH") | "| \(.VulnerabilityID // "N/A") | ⚠️ HIGH | \(.PkgName // "N/A") | \(.InstalledVersion // "N/A") | \(.FixedVersion // "Not Fixed") |"' "trivy-${{ matrix.container.name }}-results.json" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "| Error parsing | - | - | - | - |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # Show Medium vulnerabilities in collapsed section
            if [ $MEDIUM -gt 0 ]; then
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>🟡 Medium Vulnerabilities ($MEDIUM)</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| CVE | Severity | Package | Installed Version | Fixed Version |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|---------|-------------------|---------------|" >> $GITHUB_STEP_SUMMARY
              jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM") | "| \(.VulnerabilityID // "N/A") | 🟡 MEDIUM | \(.PkgName // "N/A") | \(.InstalledVersion // "N/A") | \(.FixedVersion // "Not Fixed") |"' "trivy-${{ matrix.container.name }}-results.json" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "| Error parsing | - | - | - | - |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # Show Low vulnerabilities in collapsed section
            if [ $LOW -gt 0 ]; then
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>🔵 Low Vulnerabilities ($LOW)</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| CVE | Severity | Package | Installed Version | Fixed Version |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|---------|-------------------|---------------|" >> $GITHUB_STEP_SUMMARY
              jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW") | "| \(.VulnerabilityID // "N/A") | 🔵 LOW | \(.PkgName // "N/A") | \(.InstalledVersion // "N/A") | \(.FixedVersion // "Not Fixed") |"' "trivy-${{ matrix.container.name }}-results.json" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "| Error parsing | - | - | - | - |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No vulnerabilities detected!**" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "⚠️ No vulnerability data available" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Upload Trivy scan results to GitHub Security tab
      if: inputs.enable_code_security == true && steps.build.outputs.build_success == 'true' && github.actor != 'nektos/act'
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true  # Never fail the pipeline
      with:
        sarif_file: 'trivy-${{ matrix.container.name }}-results.sarif'

    - name: Run Grype vulnerability scanner
      if: steps.build.outputs.build_success == 'true'
      uses: anchore/scan-action@v7
      id: grype-scan
      # Only continue-on-error when not enforcing severity threshold
      continue-on-error: ${{ inputs.fail_on_severity == 'none' || inputs.fail_on_severity == '' }}
      with:
        image: ${{ steps.build.outputs.full_image }}
        # Use Grype's native fail-build when severity threshold is set
        fail-build: ${{ inputs.fail_on_severity != 'none' && inputs.fail_on_severity != '' }}
        output-format: sarif
        severity-cutoff: ${{ inputs.fail_on_severity == 'none' && 'medium' || inputs.fail_on_severity }}

    - name: Upload Grype scan results
      if: inputs.enable_code_security == true && steps.build.outputs.build_success == 'true' && github.actor != 'nektos/act' && steps.grype-scan.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true  # Never fail the pipeline
      with:
        sarif_file: ${{ steps.grype-scan.outputs.sarif }}

    - name: Analyze scan results
      if: always()
      run: |
        echo "📊 Container Security Analysis for ${{ matrix.container.name }}"
        echo "=========================================="

        if [ "${{ steps.build.outputs.build_success }}" != "true" ]; then
          echo "⚠️  Container build failed - skipping security analysis"
          echo "This may be expected for intentionally vulnerable test containers"
          exit 0
        fi

        # Count vulnerabilities from Trivy JSON if available
        if [ -f "trivy-${{ matrix.container.name }}-results.json" ]; then
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-${{ matrix.container.name }}-results.json 2>/dev/null || echo "0")
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-${{ matrix.container.name }}-results.json 2>/dev/null || echo "0")
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-${{ matrix.container.name }}-results.json 2>/dev/null || echo "0")
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' trivy-${{ matrix.container.name }}-results.json 2>/dev/null || echo "0")

          echo "🔍 Vulnerability Summary:"
          echo "  Critical: $CRITICAL"
          echo "  High: $HIGH"
          echo "  Medium: $MEDIUM"
          echo "  Low: $LOW"

          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))

          if [ "$TOTAL" -gt 0 ]; then
            echo "⚠️  Found $TOTAL total vulnerabilities"
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "::warning title=High Severity Vulnerabilities::Found $CRITICAL critical and $HIGH high severity vulnerabilities in ${{ matrix.container.name }}"
            fi
          else
            echo "✅ No vulnerabilities found"
          fi
        fi

        # Display sample of results if available
        if [ -f "trivy-${{ matrix.container.name }}-results.txt" ]; then
          echo ""
          echo "📋 Sample Trivy Results:"
          head -20 "trivy-${{ matrix.container.name }}-results.txt" || echo "Could not display results"
        fi

    - name: Create container scan summary
      if: always()
      run: |
        echo "# Container Scan Summary - ${{ matrix.container.name }}" > container-summary-${{ matrix.container.name }}.md
        echo "" >> container-summary-${{ matrix.container.name }}.md
        echo "**Dockerfile:** ${{ matrix.container.dockerfile }}" >> container-summary-${{ matrix.container.name }}.md
        echo "**Context:** ${{ matrix.container.context }}" >> container-summary-${{ matrix.container.name }}.md
        echo "**Build Status:** ${{ steps.build.outputs.build_success == 'true' && 'Success' || 'Failed' }}" >> container-summary-${{ matrix.container.name }}.md

        if [ "${{ steps.build.outputs.build_success }}" == "true" ]; then
          echo "**Image:** ${{ steps.build.outputs.full_image }}" >> container-summary-${{ matrix.container.name }}.md
        fi

        echo "" >> container-summary-${{ matrix.container.name }}.md

        if [ "${{ steps.build.outputs.build_success }}" == "true" ] && [ -f "trivy-${{ matrix.container.name }}-results.txt" ]; then
          echo "## Security Scan Results" >> container-summary-${{ matrix.container.name }}.md
          echo "\`\`\`" >> container-summary-${{ matrix.container.name }}.md
          head -50 "trivy-${{ matrix.container.name }}-results.txt" >> container-summary-${{ matrix.container.name }}.md
          echo "\`\`\`" >> container-summary-${{ matrix.container.name }}.md
        elif [ "${{ steps.build.outputs.build_success }}" != "true" ]; then
          echo "## Build Failed" >> container-summary-${{ matrix.container.name }}.md
          echo "Container build failed. This may be expected for intentionally vulnerable test containers." >> container-summary-${{ matrix.container.name }}.md
        else
          echo "## No Scan Results" >> container-summary-${{ matrix.container.name }}.md
          echo "No security scan results available." >> container-summary-${{ matrix.container.name }}.md
        fi

        echo "" >> container-summary-${{ matrix.container.name }}.md
        echo "**Scan completed:** $(date)" >> container-summary-${{ matrix.container.name }}.md

    - name: Archive vulnerability scan results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: container-scan-results-${{ matrix.container.name }}
        path: |
          trivy-${{ matrix.container.name }}-results.*
          container-summary-${{ matrix.container.name }}.md
        retention-days: 30

  container-scan-summary:
    name: Container Scan Summary
    runs-on: ubuntu-latest
    needs: [discover-containers, build-and-scan]
    if: always()

    steps:
    - name: Download all scan artifacts
      if: needs.discover-containers.outputs.has_containers == 'true'
      uses: actions/download-artifact@v6
      continue-on-error: true

    - name: Create comprehensive container security report
      run: |
        echo "# Container Security Scan Summary" > container-security-report.md
        echo "" >> container-security-report.md

        if [ "${{ needs.discover-containers.outputs.has_containers }}" != "true" ]; then
          echo "## No Containers Found" >> container-security-report.md
          echo "" >> container-security-report.md
          echo "No Dockerfiles were found in this repository to scan." >> container-security-report.md
          echo "" >> container-security-report.md
          echo "To add container scanning:" >> container-security-report.md
          echo "1. Add Dockerfiles to your repository" >> container-security-report.md
          echo "2. Push changes to trigger container scanning" >> container-security-report.md
        else
          echo "## Vulnerability Counts by Severity" >> container-security-report.md
          echo "" >> container-security-report.md

          # Enhanced table with vulnerability counts by severity per container
          echo "| Container | Critical | High | Medium | Low | Total | Build Status |" >> container-security-report.md
          echo "|-----------|----------|------|--------|-----|-------|--------------|" >> container-security-report.md

          # Install jq if not available
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          # Initialize totals
          total_crit=0
          total_high=0
          total_med=0
          total_low=0
          total_all=0
          scanned_containers=0
          failed_builds=0

          # Function to parse Trivy JSON results
          parse_trivy() {
            local file="$1"
            if [ -f "$file" ] && [ -s "$file" ]; then
              local crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$file" 2>/dev/null || echo 0)
              local high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$file" 2>/dev/null || echo 0)
              local med=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' "$file" 2>/dev/null || echo 0)
              local low=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' "$file" 2>/dev/null || echo 0)
              echo "$crit $high $med $low"
            else
              echo "0 0 0 0"
            fi
          }

          # Parse results for each container
          if ls container-scan-results-* 1> /dev/null 2>&1; then
            for container_dir in container-scan-results-*; do
              if [ -d "$container_dir" ]; then
                container_name=$(echo "$container_dir" | sed 's/container-scan-results-//')

                # Skip SBOM artifact directories - they're not container scan results
                if [[ "$container_name" == sbom-* ]] || [[ "$container_name" == sbom-table-* ]]; then
                  continue
                fi

                trivy_json="$container_dir/trivy-${container_name}-results.json"

                # Check if container built successfully by looking for results
                if [ -f "$trivy_json" ]; then
                  counts=$(parse_trivy "$trivy_json")
                  read crit high med low <<< "$counts"
                  container_total=$((crit + high + med + low))

                  echo "| $container_name | $crit | $high | $med | $low | $container_total | ✅ Success |" >> container-security-report.md

                  # Add to totals
                  total_crit=$((total_crit + crit))
                  total_high=$((total_high + high))
                  total_med=$((total_med + med))
                  total_low=$((total_low + low))
                  scanned_containers=$((scanned_containers + 1))
                else
                  echo "| $container_name | - | - | - | - | - | ❌ Build Failed |" >> container-security-report.md
                  failed_builds=$((failed_builds + 1))
                fi
              fi
            done
          fi

          total_all=$((total_crit + total_high + total_med + total_low))

          echo "| **TOTAL** | **$total_crit** | **$total_high** | **$total_med** | **$total_low** | **$total_all** | - |" >> container-security-report.md
          echo "" >> container-security-report.md

          # Add scan overview
          echo "## Scan Overview" >> container-security-report.md
          echo "" >> container-security-report.md
          echo "| Metric | Count |" >> container-security-report.md
          echo "|--------|-------|" >> container-security-report.md
          echo "| Containers Scanned | $scanned_containers |" >> container-security-report.md
          echo "| Build Failures | $failed_builds |" >> container-security-report.md
          echo "| Total Vulnerabilities | $total_all |" >> container-security-report.md
          echo "| Discovery Status | ${{ needs.discover-containers.result }} |" >> container-security-report.md
          echo "| Scanning Status | ${{ needs.build-and-scan.result }} |" >> container-security-report.md
          echo "" >> container-security-report.md

          # Add priority recommendations based on actual vulnerability counts
          if [ $total_crit -gt 0 ]; then
            echo "## 🚨 CRITICAL PRIORITY" >> container-security-report.md
            echo "" >> container-security-report.md
            echo "**$total_crit critical vulnerabilities found!** These require immediate attention." >> container-security-report.md
            echo "" >> container-security-report.md
          fi

          if [ $total_high -gt 0 ]; then
            echo "## ⚠️ HIGH PRIORITY" >> container-security-report.md
            echo "" >> container-security_report.md
            echo "**$total_high high-severity vulnerabilities found.** Address these as soon as possible." >> container-security-report.md
            echo "" >> container-security-report.md
          fi

          if [ $total_all -eq 0 ] && [ $scanned_containers -gt 0 ]; then
            echo "## ✅ NO VULNERABILITIES DETECTED" >> container-security-report.md
            echo "" >> container-security-report.md
            echo "Great work! No security vulnerabilities were detected in the scanned containers." >> container-security-report.md
            echo "" >> container-security-report.md
          fi

          # Build failure notes
          if [ $failed_builds -gt 0 ]; then
            echo "## ⚠️ BUILD FAILURES" >> container-security-report.md
            echo "" >> container-security-report.md
            echo "**$failed_builds container(s) failed to build.** This may be expected for intentionally vulnerable test containers." >> container-security-report.md
            echo "" >> container-security-report.md
          fi

          echo "## Container Details" >> container-security-report.md
          echo "" >> container-security-report.md

          # Include individual container summaries with enhanced details
          if ls container-scan-results-*/container-summary-*.md 1> /dev/null 2>&1; then
            for summary in container-scan-results-*/container-summary-*.md; do
              if [ -f "$summary" ]; then
                container_name=$(basename "$summary" .md | sed 's/container-summary-//')

                # Skip SBOM artifact summaries if they somehow exist
                if [[ "$container_name" == sbom-* ]] || [[ "$container_name" == sbom-table-* ]]; then
                  continue
                fi

                echo "### $container_name" >> container-security-report.md

                # Add vulnerability breakdown for this container
                trivy_json="container-scan-results-${container_name}/trivy-${container_name}-results.json"
                if [ -f "$trivy_json" ]; then
                  counts=$(parse_trivy "$trivy_json")
                  read crit high med low <<< "$counts"
                  container_total=$((crit + high + med + low))

                  echo "" >> container-security-report.md
                  echo "**Vulnerability Summary:** $container_total total ($crit critical, $high high, $med medium, $low low)" >> container-security-report.md
                  echo "" >> container-security-report.md
                fi

                cat "$summary" >> container-security-report.md
                echo "" >> container-security-report.md
              fi
            done
          else
            echo "No detailed container summaries available." >> container-security-report.md
          fi
        fi

        echo "## Security Reports Location" >> container-security-report.md
        echo "" >> container-security-report.md
        echo "🔍 **Container scan results are available in the following locations:**" >> container-security-report.md
        echo "" >> container-security-report.md
        echo "1. **Workflow Artifacts** - Download detailed reports from the Actions tab" >> container-security-report.md
        echo "2. **GitHub Security Tab** - If GitHub Advanced Security is enabled" >> container-security-report.md
        echo "3. **SARIF Files** - Available as artifacts for integration with other tools" >> container-security-report.md
        echo "" >> container-security-report.md
        echo "📋 **Available Report Formats:**" >> container-security-report.md
        echo "- SARIF (for security tools integration)" >> container-security-report.md
        echo "- JSON (for programmatic analysis)" >> container-security-report.md
        echo "- Text (for human-readable output)" >> container-security-report.md
        echo "" >> container-security-report.md

        echo "## Security Testing Notes" >> container-security-report.md
        echo "" >> container-security-report.md
        echo "This repository contains both secure and vulnerable container examples for testing:" >> container-security-report.md
        echo "" >> container-security-report.md
        echo "- **Secure containers** should show minimal vulnerabilities" >> container-security_report.md
        echo "- **Vulnerable containers** are intentionally insecure for testing detection capabilities" >> container-security_report.md
        echo "- **Build failures** on vulnerable containers may be expected due to intentional issues" >> container-security_report.md
        echo "" >> container-security-report.md

        echo "## Recommendations" >> container-security-report.md
        echo "" >> container-security-report.md
        echo "1. **Download artifacts** to review detailed vulnerability findings" >> container-security-report.md
        echo "2. **Address high and critical severity vulnerabilities** first" >> container-security-report.md
        echo "3. **Update base images and dependencies** with known vulnerabilities" >> container-security-report.md
        echo "4. **Use minimal base images** (Alpine, distroless) to reduce attack surface" >> container-security_report.md
        echo "5. **Implement multi-stage builds** to minimize final image size" >> container-security_report.md
        echo "6. **Run containers as non-root users** when possible" >> container-security_report.md
        echo "7. **Consider enabling GitHub Advanced Security** for integrated security dashboard" >> container-security_report.md
        echo "" >> container-security-report.md

        echo "## GitHub Advanced Security" >> container-security-report.md
        echo "" >> container-security-report.md
        echo "ℹ️  **Note:** Some SARIF uploads may show warnings if GitHub Advanced Security is not enabled." >> container-security-report.md
        echo "This doesn't affect the container scanning - all results are still available as downloadable artifacts." >> container-security-report.md
        echo "" >> container-security-report.md
        echo "To enable Code Security features:" >> container-security-report.md
        echo "1. Go to repository Settings > Security & Analysis" >> container-security-report.md
        echo "2. Enable 'Private vulnerability reporting'" >> container-security-report.md
        echo "3. Enable 'Dependency review' (requires GitHub Advanced Security)" >> container-security-report.md
        echo "4. Enable 'Code scanning' (requires GitHub Advanced Security)" >> container-security-report.md
        echo "" >> container-security-report.md
        echo "Generated on: $(date)" >> container-security-report.md

    - name: Upload container security report
      uses: actions/upload-artifact@v5
      with:
        name: container-security-summary
        path: container-security-report.md
        retention-days: 30

    - name: Generate container summary and add to job summary
      if: always()
      run: |
        mkdir -p scanner-summaries

        # Function to parse Trivy JSON results (returns: crit high med low unique)
        parse_trivy() {
          local file="$1"
          if [ -f "$file" ] && [ -s "$file" ]; then
            local crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$file" 2>/dev/null || echo 0)
            local high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$file" 2>/dev/null || echo 0)
            local med=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' "$file" 2>/dev/null || echo 0)
            local low=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' "$file" 2>/dev/null || echo 0)
            local unique=$(jq '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | map(select(. != null)) | unique | length' "$file" 2>/dev/null || echo 0)
            echo "$crit $high $med $low $unique"
          else
            echo "0 0 0 0 0"
          fi
        }

        # Generate content function that writes to both destinations
        generate_summary() {
          local dest="$1"  # Either file path or "both"

          # Check if we have container scan results
          if compgen -G "container-scan-results-*" > /dev/null 2>&1 || compgen -G "trivy-*-results.sarif" > /dev/null 2>&1; then
            # Initialize totals
            TOTAL_CRITICAL=0
            TOTAL_HIGH=0
            TOTAL_MEDIUM=0
            TOTAL_LOW=0
            TOTAL_UNIQUE=0
            SCANNED_CONTAINERS=0
            FAILED_BUILDS=0

            # Collect container data
            declare -a CONTAINER_DATA
            # Collect all unique CVE IDs across all containers
            declare -a ALL_CVE_IDS

            # Parse results for each container
            if ls container-scan-results-* 1> /dev/null 2>&1; then
              for container_dir in container-scan-results-*; do
                if [ -d "$container_dir" ]; then
                  container_name=$(echo "$container_dir" | sed 's/container-scan-results-//')

                  # Skip SBOM artifact directories - they're not container scan results
                  if [[ "$container_name" == sbom-* ]] || [[ "$container_name" == sbom-table-* ]]; then
                    continue
                  fi

                  trivy_json="$container_dir/trivy-${container_name}-results.json"

                  # Check if container built successfully by looking for results
                  if [ -f "$trivy_json" ]; then
                    counts=$(parse_trivy "$trivy_json")
                    read crit high med low unique <<< "$counts"
                    container_total=$((crit + high + med + low))

                    # Store container data for later use (includes unique count)
                    CONTAINER_DATA+=("$container_name|$crit|$high|$med|$low|$container_total|$unique|success")

                    # Collect CVE IDs for cross-container unique calculation
                    while IFS= read -r cve_id; do
                      if [ -n "$cve_id" ] && [ "$cve_id" != "null" ]; then
                        ALL_CVE_IDS+=("$cve_id")
                      fi
                    done < <(jq -r '.Results[]?.Vulnerabilities[]?.VulnerabilityID // empty' "$trivy_json" 2>/dev/null)

                    # Add to totals
                    TOTAL_CRITICAL=$((TOTAL_CRITICAL + crit))
                    TOTAL_HIGH=$((TOTAL_HIGH + high))
                    TOTAL_MEDIUM=$((TOTAL_MEDIUM + med))
                    TOTAL_LOW=$((TOTAL_LOW + low))
                    SCANNED_CONTAINERS=$((SCANNED_CONTAINERS + 1))
                  else
                    CONTAINER_DATA+=("$container_name|0|0|0|0|0|0|failed")
                    FAILED_BUILDS=$((FAILED_BUILDS + 1))
                  fi
                fi
              done
            fi

            TOTAL_VULN=$((TOTAL_CRITICAL + TOTAL_HIGH + TOTAL_MEDIUM + TOTAL_LOW))

            # Calculate unique CVEs across all containers
            if [ ${#ALL_CVE_IDS[@]} -gt 0 ]; then
              TOTAL_UNIQUE=$(printf '%s\n' "${ALL_CVE_IDS[@]}" | sort -u | wc -l | tr -d ' ')
            else
              TOTAL_UNIQUE=0
            fi

            # Write to both PR artifact and job summary
            for output in "scanner-summaries/container.md" "$GITHUB_STEP_SUMMARY"; do
              # PR comment artifact needs details wrapper, job summary doesn't
              if [[ "$output" == *"container.md" ]]; then
                echo "<details>" >> "$output"
                echo "<summary>🔍 Container Security</summary>" >> "$output"
                echo "" >> "$output"
                echo "**Status:** ✅ Completed" >> "$output"
              else
                echo "## 🔍 Container Security Scan Summary" >> "$output"
              fi
              echo "" >> "$output"

              # Overall Summary
              echo "### 📊 Overall Summary" >> "$output"
              echo "" >> "$output"
              echo "| 🚨 Critical | ⚠️ High | 🟡 Medium | 🔵 Low | 📦 Total | 🔢 Unique |" >> "$output"
              echo "|-------------|---------|-----------|---------|----------|----------|" >> "$output"
              echo "| **$TOTAL_CRITICAL** | **$TOTAL_HIGH** | **$TOTAL_MEDIUM** | **$TOTAL_LOW** | **$TOTAL_VULN** | **$TOTAL_UNIQUE** |" >> "$output"
              echo "" >> "$output"
              echo "**Scanned:** $SCANNED_CONTAINERS containers | **Build Failures:** $FAILED_BUILDS" >> "$output"
              echo "" >> "$output"

              # Priority messages
              if [ $TOTAL_CRITICAL -gt 0 ]; then
                echo "🚨 **URGENT**: $TOTAL_CRITICAL critical vulnerabilities need immediate attention" >> "$output"
                echo "" >> "$output"
              fi
              if [ $TOTAL_HIGH -gt 0 ]; then
                echo "⚠️ **HIGH**: $TOTAL_HIGH high-severity vulnerabilities to address within 24h" >> "$output"
                echo "" >> "$output"
              fi

              # Individual container breakdowns
              echo "### 📦 Individual Containers" >> "$output"
              echo "" >> "$output"

              for container_data in "${CONTAINER_DATA[@]}"; do
                IFS='|' read -r name crit high med low total unique status <<< "$container_data"

                if [ "$status" = "failed" ]; then
                  echo "<details>" >> "$output"
                  echo "<summary><strong>$name</strong> - ❌ Build Failed</summary>" >> "$output"
                  echo "" >> "$output"
                  echo "**Status:** Build failed - this may be expected for intentionally vulnerable test containers." >> "$output"
                  echo "" >> "$output"
                  echo "**Actions:**" >> "$output"
                  echo "- Review build logs in the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$output"
                  echo "- Check Dockerfile syntax and dependencies" >> "$output"
                  echo "" >> "$output"
                  echo "</details>" >> "$output"
                  echo "" >> "$output"
                else
                  # Determine risk emoji
                  if [ $crit -gt 0 ]; then
                    risk_emoji="🚨"
                  elif [ $high -gt 0 ]; then
                    risk_emoji="⚠️"
                  elif [ $total -gt 0 ]; then
                    risk_emoji="🟡"
                  else
                    risk_emoji="✅"
                  fi

                  echo "<details>" >> "$output"
                  echo "<summary><strong>$name</strong> - $risk_emoji $total vulnerabilities</summary>" >> "$output"
                  echo "" >> "$output"
                  echo "| 🚨 Critical | ⚠️ High | 🟡 Medium | 🔵 Low | Total |" >> "$output"
                  echo "|-------------|---------|-----------|---------|-------|" >> "$output"
                  echo "| $crit | $high | $med | $low | $total |" >> "$output"
                  echo "" >> "$output"

                  if [ $crit -gt 0 ]; then
                    echo "**🚨 Critical Issues**" >> "$output"
                    echo "- $crit critical vulnerabilities require immediate attention" >> "$output"
                    echo "- Should be addressed before deployment" >> "$output"
                    echo "" >> "$output"
                  fi

                  if [ $high -gt 0 ]; then
                    echo "**⚠️ High Priority**" >> "$output"
                    echo "- $high high-severity vulnerabilities found" >> "$output"
                    echo "- Address within 24 hours" >> "$output"
                    echo "" >> "$output"
                  fi

                  if [ $total -eq 0 ]; then
                    echo "**✅ No Vulnerabilities**" >> "$output"
                    echo "Great! This container has no detected vulnerabilities." >> "$output"
                    echo "" >> "$output"
                  else
                    # Add detailed vulnerability table
                    trivy_json="container-scan-results-${name}/trivy-${name}-results.json"
                    if [ -f "$trivy_json" ]; then
                      echo "<details open>" >> "$output"
                      echo "<summary>🔍 Vulnerability Details</summary>" >> "$output"
                      echo "" >> "$output"

                      # Show Critical vulnerabilities
                      if [ $crit -gt 0 ]; then
                        echo "#### 🚨 Critical Vulnerabilities ($crit)" >> "$output"
                        echo "" >> "$output"
                        echo "| CVE | Severity | Package | Installed Version | Fixed Version |" >> "$output"
                        echo "|-----|----------|---------|-------------------|---------------|" >> "$output"
                        jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL") | "| \(.VulnerabilityID // "N/A") | 🚨 CRITICAL | \(.PkgName // "N/A") | \(.InstalledVersion // "N/A") | \(.FixedVersion // "Not Fixed") |"' "$trivy_json" >> "$output" 2>/dev/null || echo "| Error parsing | - | - | - | - |" >> "$output"
                        echo "" >> "$output"
                      fi

                      # Show High vulnerabilities
                      if [ $high -gt 0 ]; then
                        echo "#### ⚠️ High Vulnerabilities ($high)" >> "$output"
                        echo "" >> "$output"
                        echo "| CVE | Severity | Package | Installed Version | Fixed Version |" >> "$output"
                        echo "|-----|----------|---------|-------------------|---------------|" >> "$output"
                        jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH") | "| \(.VulnerabilityID // "N/A") | ⚠️ HIGH | \(.PkgName // "N/A") | \(.InstalledVersion // "N/A") | \(.FixedVersion // "Not Fixed") |"' "$trivy_json" >> "$output" 2>/dev/null || echo "| Error parsing | - | - | - | - |" >> "$output"
                        echo "" >> "$output"
                      fi

                      # Show Medium vulnerabilities in collapsed section
                      if [ $med -gt 0 ]; then
                        echo "<details>" >> "$output"
                        echo "<summary>🟡 Medium Vulnerabilities ($med)</summary>" >> "$output"
                        echo "" >> "$output"
                        echo "| CVE | Severity | Package | Installed Version | Fixed Version |" >> "$output"
                        echo "|-----|----------|---------|-------------------|---------------|" >> "$output"
                        jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM") | "| \(.VulnerabilityID // "N/A") | 🟡 MEDIUM | \(.PkgName // "N/A") | \(.InstalledVersion // "N/A") | \(.FixedVersion // "Not Fixed") |"' "$trivy_json" >> "$output" 2>/dev/null || echo "| Error parsing | - | - | - | - |" >> "$output"
                        echo "" >> "$output"
                        echo "</details>" >> "$output"
                        echo "" >> "$output"
                      fi

                      # Show Low vulnerabilities in collapsed section
                      if [ $low -gt 0 ]; then
                        echo "<details>" >> "$output"
                        echo "<summary>🔵 Low Vulnerabilities ($low)</summary>" >> "$output"
                        echo "" >> "$output"
                        echo "| CVE | Severity | Package | Installed Version | Fixed Version |" >> "$output"
                        echo "|-----|----------|---------|-------------------|---------------|" >> "$output"
                        jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW") | "| \(.VulnerabilityID // "N/A") | 🔵 LOW | \(.PkgName // "N/A") | \(.InstalledVersion // "N/A") | \(.FixedVersion // "Not Fixed") |"' "$trivy_json" >> "$output" 2>/dev/null || echo "| Error parsing | - | - | - | - |" >> "$output"
                        echo "" >> "$output"
                        echo "</details>" >> "$output"
                        echo "" >> "$output"
                      fi

                      echo "</details>" >> "$output"
                      echo "" >> "$output"
                    fi
                  fi

                  echo "</details>" >> "$output"
                  echo "" >> "$output"
                fi
              done

              echo "**📁 Artifacts:** [Container Scan Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> "$output"

              # Close details wrapper only for PR artifact
              if [[ "$output" == *"container.md" ]]; then
                echo "" >> "$output"
                echo "</details>" >> "$output"
              fi
              echo "" >> "$output"
            done
          else
            # No containers found
            echo "<details>" >> scanner-summaries/container.md
            echo "<summary>🔍 Container Security</summary>" >> scanner-summaries/container.md
            echo "" >> scanner-summaries/container.md
            echo "**Status:** ⏭️ Skipped" >> scanner-summaries/container.md
            echo "" >> scanner-summaries/container.md
            echo "</details>" >> scanner-summaries/container.md
            echo "" >> scanner-summaries/container.md

            echo "## 🔍 Container Security Scan Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ⏭️ No containers found to scan" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
        }

        # Generate the summary (writes to both locations)
        generate_summary
      continue-on-error: true

    - name: Upload Container summary section
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: scanner-summary-container
        path: scanner-summaries/container.md
        retention-days: 7
      continue-on-error: true
