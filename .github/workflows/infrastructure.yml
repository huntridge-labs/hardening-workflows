name: Infrastructure Security Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      iac_path:
        description: 'Relative path to the infrastructure-as-code directory to scan'
        required: false
        type: string
        default: 'infrastructure'
      python_version:
        description: 'Python version to use for IaC scanners'
        required: false
        type: string
        default: '3.12'
      aws_region:
        description: 'AWS region used for IaC tooling that requires region context'
        required: false
        type: string
        default: 'us-east-1'
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if vulnerabilities at or above this severity are found. Options: none, low, medium, high, critical. Set to "none" to never fail.'
        required: false
        type: string
        default: 'none'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  PYTHON_VERSION: ${{ inputs.python_version }}
  AWS_REGION: ${{ inputs.aws_region }}

jobs:
  infrastructure-security:
    name: Infrastructure Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Prepare infrastructure scan directory
      run: |
        IAC_PATH="${{ inputs.iac_path }}"
        if [ -z "$IAC_PATH" ]; then
          IAC_PATH='infrastructure'
        fi

        if [ ! -d "$IAC_PATH" ]; then
          echo "⚠️  Directory '$IAC_PATH' not found. Skipping infrastructure scans."
          exit 0
        fi

        mkdir -p "$IAC_PATH"/security-reports
        echo "📁 Created security reports directory: $IAC_PATH/security-reports"

    - name: Run Trivy Infrastructure Scan
      uses: aquasecurity/trivy-action@0.33.1
      with:
        scan-type: 'config'
        scan-ref: '${{ inputs.iac_path }}'
        format: 'sarif'
        output: '${{ inputs.iac_path }}/security-reports/trivy-results.sarif'
        hide-progress: true
      continue-on-error: true

    - name: Run Checkov Infrastructure Scan
      uses: bridgecrewio/checkov-action@v12.3075.0
      with:
        directory: ${{ inputs.iac_path }}
        framework: terraform
        output_format: sarif, json
        output_file_path: ${{ inputs.iac_path }}/security-reports/checkov-results.sarif,${{ inputs.iac_path }}/security-reports/checkov-results.json
      continue-on-error: true

    - name: Upload infrastructure SARIF results
      uses: github/codeql-action/upload-sarif@v4
      if: inputs.enable_code_security == true && always() && github.actor != 'nektos/act'
      with:
        sarif_file: ${{ inputs.iac_path }}/security-reports/trivy-results.sarif
        category: infrastructure-trivy
      continue-on-error: true

    - name: Upload Checkov SARIF results
      uses: github/codeql-action/upload-sarif@v4
      if: inputs.enable_code_security == true && always() && github.actor != 'nektos/act'
      with:
        sarif_file: ${{ inputs.iac_path }}/security-reports/checkov-results.sarif
        category: infrastructure-checkov
      continue-on-error: true

    - name: Upload infrastructure artifacts
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: infrastructure-security-reports
        path: |
          ${{ inputs.iac_path }}/security-reports/
        retention-days: 30

    - name: Check severity threshold
      if: inputs.fail_on_severity != 'none' && inputs.fail_on_severity != ''
      run: |
        FAIL_ON="${{ inputs.fail_on_severity }}"
        IAC_PATH="${{ inputs.iac_path }}"

        echo "🔍 Checking for issues at or above severity: $FAIL_ON"

        CRITICAL=0
        HIGH=0
        MEDIUM=0
        LOW=0

        # Parse Trivy JSON results
        TRIVY_JSON="$IAC_PATH/security-reports/trivy-results.json"
        if [ -f "$TRIVY_JSON" ]; then
          CRITICAL=$((CRITICAL + $(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "CRITICAL")] | length' "$TRIVY_JSON" 2>/dev/null || echo "0")))
          HIGH=$((HIGH + $(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "HIGH")] | length' "$TRIVY_JSON" 2>/dev/null || echo "0")))
          MEDIUM=$((MEDIUM + $(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "MEDIUM")] | length' "$TRIVY_JSON" 2>/dev/null || echo "0")))
          LOW=$((LOW + $(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "LOW")] | length' "$TRIVY_JSON" 2>/dev/null || echo "0")))
        fi

        # Parse Checkov JSON results
        CHECKOV_JSON="$IAC_PATH/security-reports/checkov-results.json"
        if [ -f "$CHECKOV_JSON" ]; then
          CHECKOV_CRITICAL=$(jq '[.results.failed_checks[]? | select(.severity == "CRITICAL")] | length' "$CHECKOV_JSON" 2>/dev/null || echo "0")
          CHECKOV_HIGH=$(jq '[.results.failed_checks[]? | select(.severity == "HIGH")] | length' "$CHECKOV_JSON" 2>/dev/null || echo "0")
          CHECKOV_MEDIUM=$(jq '[.results.failed_checks[]? | select(.severity == "MEDIUM")] | length' "$CHECKOV_JSON" 2>/dev/null || echo "0")
          CHECKOV_LOW=$(jq '[.results.failed_checks[]? | select(.severity == "LOW")] | length' "$CHECKOV_JSON" 2>/dev/null || echo "0")

          # If no severity info, count all failures as high
          if [ "$CHECKOV_CRITICAL" == "0" ] && [ "$CHECKOV_HIGH" == "0" ] && [ "$CHECKOV_MEDIUM" == "0" ] && [ "$CHECKOV_LOW" == "0" ]; then
            CHECKOV_HIGH=$(jq '.results.failed_checks | length' "$CHECKOV_JSON" 2>/dev/null || echo "0")
          fi

          CRITICAL=$((CRITICAL + CHECKOV_CRITICAL))
          HIGH=$((HIGH + CHECKOV_HIGH))
          MEDIUM=$((MEDIUM + CHECKOV_MEDIUM))
          LOW=$((LOW + CHECKOV_LOW))
        fi

        echo "📊 Combined severity counts: Critical=$CRITICAL, High=$HIGH, Medium=$MEDIUM, Low=$LOW"

        SHOULD_FAIL=false
        case "$FAIL_ON" in
          low)
            if [ "$LOW" -gt 0 ] || [ "$MEDIUM" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
              SHOULD_FAIL=true
            fi
            ;;
          medium)
            if [ "$MEDIUM" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
              SHOULD_FAIL=true
            fi
            ;;
          high)
            if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
              SHOULD_FAIL=true
            fi
            ;;
          critical)
            if [ "$CRITICAL" -gt 0 ]; then
              SHOULD_FAIL=true
            fi
            ;;
        esac

        if [ "$SHOULD_FAIL" = "true" ]; then
          echo "❌ Found issues at or above $FAIL_ON severity level"
          exit 1
        else
          echo "✅ No issues at or above $FAIL_ON severity level"
        fi

    - name: Generate Infrastructure summary section
      if: always()
      run: |
        mkdir -p scanner-summaries

        echo "<details>" > scanner-summaries/infrastructure.md
        echo "<summary>🔍 Infrastructure Security</summary>" >> scanner-summaries/infrastructure.md
        echo "" >> scanner-summaries/infrastructure.md

        if [ -d "${{ inputs.iac_path }}/security-reports" ] && [ "$(ls -A ${{ inputs.iac_path }}/security-reports 2>/dev/null)" ]; then
          echo "**Status:** ✅ Completed" >> scanner-summaries/infrastructure.md
          echo "" >> scanner-summaries/infrastructure.md

          # Count issues from SARIF files
          ISSUE_COUNT=0
          HIGH_COUNT=0
          MEDIUM_COUNT=0
          LOW_COUNT=0

          for sarif_file in $(find ${{ inputs.iac_path }}/security-reports -name "*.sarif" -type f 2>/dev/null); do
            if [ -f "$sarif_file" ] && [ -s "$sarif_file" ] && command -v jq >/dev/null 2>&1; then
              issues=$(jq -r '.runs[]?.results[]? | .ruleId' "$sarif_file" 2>/dev/null | wc -l | tr -d ' ')
              ISSUE_COUNT=$((ISSUE_COUNT + issues))

              high=$(jq -r '.runs[]?.results[]? | select(.level == "error" or .level == "warning") | .ruleId' "$sarif_file" 2>/dev/null | wc -l | tr -d ' ')
              HIGH_COUNT=$((HIGH_COUNT + high))

              medium=$(jq -r '.runs[]?.results[]? | select(.level == "note") | .ruleId' "$sarif_file" 2>/dev/null | wc -l | tr -d ' ')
              MEDIUM_COUNT=$((MEDIUM_COUNT + medium))

              low=$(jq -r '.runs[]?.results[]? | select(.level == "info") | .ruleId' "$sarif_file" 2>/dev/null | wc -l | tr -d ' ')
              LOW_COUNT=$((LOW_COUNT + low))
            fi
          done

          echo "**Issues Found:** $ISSUE_COUNT" >> scanner-summaries/infrastructure.md
          echo "" >> scanner-summaries/infrastructure.md

          if [ $ISSUE_COUNT -gt 0 ]; then
            echo "| Severity | Count |" >> scanner-summaries/infrastructure.md
            echo "|----------|-------|" >> scanner-summaries/infrastructure.md
            [ $HIGH_COUNT -gt 0 ] && echo "| 🟠 High | $HIGH_COUNT |" >> scanner-summaries/infrastructure.md
            [ $MEDIUM_COUNT -gt 0 ] && echo "| 🟡 Medium | $MEDIUM_COUNT |" >> scanner-summaries/infrastructure.md
            [ $LOW_COUNT -gt 0 ] && echo "| 🔵 Low | $LOW_COUNT |" >> scanner-summaries/infrastructure.md
            echo "" >> scanner-summaries/infrastructure.md
          fi

          echo "**📁 Artifacts:** [Infrastructure Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> scanner-summaries/infrastructure.md
        else
          echo "**Status:** ⏭️ Skipped" >> scanner-summaries/infrastructure.md
        fi

        echo "" >> scanner-summaries/infrastructure.md
        echo "</details>" >> scanner-summaries/infrastructure.md
        echo "" >> scanner-summaries/infrastructure.md
      continue-on-error: true

    - name: Upload Infrastructure summary section
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: scanner-summary-infrastructure
        path: scanner-summaries/infrastructure.md
        retention-days: 7
      continue-on-error: true
