name: Container Scan from Config

# This workflow is designed to be COPIED to your repository, not called remotely.
# Why? To add custom secrets to the env block, you need to edit this file.
#
# Setup Instructions:
# 1. Copy this workflow to .github/workflows/ in your repository
# 2. Add your custom secrets to the env block in the parse-config job
#    Example: MY_CUSTOM_SECRET: ${{ secrets.MY_CUSTOM_SECRET }}
# 3. Create your container config file (YAML/JSON/JS) using examples/ as reference
# 4. Config files use ${SECRET_NAME} syntax to reference secrets
#
# IMPORTANT: Version Synchronization
# The 'ref' values below MUST match to avoid version skew issues:
# - parse-config job: Checkout hardening-workflows ref (line ~60)
# - scan-containers job: uses: ...container-scan.yml@<ref> (line ~115)
# When updating, change BOTH refs to the same version tag (e.g., 'v3.0.0')
#
# Registry Authentication Flow:
# 1. Users specify which secret to use in config file via 'registry.auth_secret'
#    Example:
#      registry:
#        auth_secret: GITHUB_TOKEN
# 2. parse-container-config.js extracts the secret name into the matrix
# 3. Matrix output contains: registry_auth_secret: "GITHUB_TOKEN"
# 4. scan-containers maps it dynamically: secrets: registry_password: ${{ secrets[matrix.registry_auth_secret] }}
# 5. container-scan.yml receives the actual secret value from GitHub's secrets context
#
# This approach:
# - Keeps secret names (not values) in matrix output (safe from redaction)
# - Allows per-container secret mapping (different containers can use different secrets)
# - Works with any GitHub repository secret name

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to container config file (YAML, JSON, or JS)'
        required: false
        default: 'examples/container-config.example.yml'
        type: string
  workflow_call:
    inputs:
      config_file:
        description: 'Path to container config file (YAML, JSON, or JS)'
        required: false
        default: 'examples/container-config.example.yml'
        type: string
    secrets:
      HARDENING_WORKFLOWS_CHECKOUT_TOKEN:
        description: 'Token for checking out hardening-workflows repo (required for private GHE)'
        required: false
      # Registry authentication secrets - add your custom secrets here
      # These are passed through to the container-scan.yml workflow
      REGISTRY_PASSWORD:
        description: 'Password or token for container registry authentication'
        required: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  # ⚠️ GHE FORKS: Update this to your forked repo path (e.g., 'my-org/hardening-workflows')
  #               You must also update the 'uses:' line in scan-containers job below
  HARDENING_WORKFLOWS_REPO_PATH: huntridge-labs/hardening-workflows
  # For GHE forks: Update this to your desired ref/tag
  HARDENING_WORKFLOWS_REF: feat/remote-registries

jobs:
  parse-config:
    name: Parse Container Config
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      has_containers: ${{ steps.parse.outputs.has_containers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout hardening-workflows for parser script
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HARDENING_WORKFLOWS_REPO_PATH }}
          ref: ${{ env.HARDENING_WORKFLOWS_REF }}
          path: .hardening-workflows
          token: ${{ secrets.HARDENING_WORKFLOWS_CHECKOUT_TOKEN || github.token }}
          sparse-checkout: |
            .github/scripts/parse-container-config.js
            .github/schemas/container-config.schema.json

      - name: Check for updates to this template
        run: |
          echo "🔍 Checking for updates to container-scan-from-config.yml template..."
          TEMPLATE_URL="https://raw.githubusercontent.com/${{ env.HARDENING_WORKFLOWS_REPO_PATH }}/${{ env.HARDENING_WORKFLOWS_REF }}/.github/workflows/container-scan-from-config.yml"
          curl -sSL "$TEMPLATE_URL" -o latest-template.yml

          # Strip user-customizable sections before comparing:
          # - env: block contents (secrets mappings)
          # - secrets: block under workflow_call
          # - secrets: block under scan-containers
          strip_customizable() {
            sed -E '
              # Remove env block contents (keep the env: line, remove until next non-indented line)
              /^[[:space:]]+env:$/,/^[[:space:]]+[a-zA-Z_-]+:[[:space:]]*$|^[[:space:]]+run:/{
                /^[[:space:]]+env:$/!{ /^[[:space:]]+run:/!d; }
              }
              # Remove comment lines that users might customize
              /^[[:space:]]*#.*SECRET|^[[:space:]]*#.*[Ee]xample|^[[:space:]]*#.*uncomment/d
            ' "$1"
          }

          strip_customizable .github/workflows/container-scan-from-config.yml > local-stripped.yml
          strip_customizable latest-template.yml > template-stripped.yml

          if diff -q local-stripped.yml template-stripped.yml > /dev/null 2>&1; then
            echo "✅ Template is up to date (structural changes only checked, env/secrets ignored)"
          else
            echo "⚠️ Template has updates available. Differences (excluding env/secrets):"
            echo ""
            diff -u local-stripped.yml template-stripped.yml || true
            echo ""
            echo "📋 Review changes at: https://github.com/huntridge-labs/hardening-workflows/blob/main/.github/workflows/container-scan-from-config.yml"
          fi

          rm -f latest-template.yml local-stripped.yml template-stripped.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --no-save js-yaml ajv

      - name: Parse and validate config
        id: parse
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          SCHEMA_FILE: .hardening-workflows/.github/schemas/container-config.schema.json
          # ADD YOUR CUSTOM SECRETS HERE
          # Any secret referenced in your config file using ${SECRET_NAME} syntax
          # must be listed here as: SECRET_NAME: ${{ secrets.SECRET_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Example registry secrets (uncomment and add as needed):
          # GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          # ECR_PASSWORD: ${{ secrets.ECR_PASSWORD }}
          # DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # GCR_JSON_KEY: ${{ secrets.GCR_JSON_KEY }}
          # ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          # ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          # MY_REGISTRY_USER: ${{ secrets.MY_REGISTRY_USER }}
          # MY_REGISTRY_PASS: ${{ secrets.MY_REGISTRY_PASS }}
        run: |
          node .hardening-workflows/.github/scripts/parse-container-config.js

          # Check if we have containers to scan
          if [ -f "$GITHUB_OUTPUT" ]; then
            MATRIX=$(grep "^matrix=" "$GITHUB_OUTPUT" | cut -d= -f2-)
            if [ -n "$MATRIX" ] && [ "$MATRIX" != "{}" ] && [ "$MATRIX" != '{"include":[]}' ]; then
              echo "has_containers=true" >> $GITHUB_OUTPUT
            else
              echo "has_containers=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_containers=false" >> $GITHUB_OUTPUT
          fi

  # Call container-scan.yml for each container in the matrix
  scan-containers:
    name: Scan ${{ matrix.name }}
    needs: parse-config
    if: needs.parse-config.outputs.has_containers == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.parse-config.outputs.matrix) }}
    # ⚠️ GHE FORKS: Update this path manually - 'uses:' cannot use env vars (GitHub limitation)
    # Keep in sync with HARDENING_WORKFLOWS_REPO_PATH and HARDENING_WORKFLOWS_REF above
    uses: huntridge-labs/hardening-workflows/.github/workflows/container-scan.yml@feat/remote-registries
    with:
      scan_mode: 'remote'
      image_ref: ${{ matrix.image }}
      container_name: ${{ matrix.name }}
      registry_username: ${{ matrix.registry_username }}
      scanners: ${{ matrix.scanners }}
      fail_on_severity: ${{ matrix.fail_on_severity }}
      enable_code_security: ${{ matrix.enable_code_security }}
      post_pr_comment: ${{ matrix.post_pr_comment }}
    secrets:
      registry_password: ${{ secrets[matrix.registry_auth_secret] }}

  # Summary job collects all results
  scan-summary:
    name: Container Scan Summary
    runs-on: ubuntu-latest
    needs: [parse-config, scan-containers]
    if: always()
    steps:
      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: container-scan-results-*
          merge-multiple: true

      - name: Generate scan summary
        run: |
          echo "# Container Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.parse-config.outputs.has_containers }}" != "true" ]; then
            echo "⚠️ No containers found to scan." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Initialize counters
          total_crit=0
          total_high=0
          total_med=0
          total_low=0

          echo "| Container | Critical | High | Medium | Low | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|----------|------|--------|-----|--------|" >> $GITHUB_STEP_SUMMARY

          # Process each container summary if available
          for summary_file in container-summary-*.md; do
            if [ -f "$summary_file" ]; then
              container_name=$(echo "$summary_file" | sed 's/container-summary-//' | sed 's/\.md$//')

              # Try to extract counts from JSON results
              trivy_json="trivy-${container_name}-results.json"
              if [ -f "$trivy_json" ]; then
                crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$trivy_json" 2>/dev/null || echo "0")
                high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$trivy_json" 2>/dev/null || echo "0")
                med=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' "$trivy_json" 2>/dev/null || echo "0")
                low=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' "$trivy_json" 2>/dev/null || echo "0")

                total_crit=$((total_crit + crit))
                total_high=$((total_high + high))
                total_med=$((total_med + med))
                total_low=$((total_low + low))

                echo "| $container_name | $crit | $high | $med | $low | ✅ |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $container_name | - | - | - | - | ⚠️ No data |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total:** Critical: $total_crit, High: $total_high, Medium: $total_med, Low: $total_low" >> $GITHUB_STEP_SUMMARY
