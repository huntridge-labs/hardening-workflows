name: Container Scan from Config

# This workflow is designed to be COPIED to your repository, not called remotely.
# Why? To add custom secrets to the env block, you need to edit this file.
#
# Setup Instructions:
# 1. Copy this workflow to .github/workflows/ in your repository
# 2. Add your custom secrets to the env block in the parse-config job
#    Example: MY_CUSTOM_SECRET: ${{ secrets.MY_CUSTOM_SECRET }}
# 3. Create your container config file (YAML/JSON/JS) using examples/ as reference
# 4. Config files use ${SECRET_NAME} syntax to reference secrets

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to container config file (YAML, JSON, or JS)'
        required: false
        default: 'examples/container-config.example.yml'
        type: string
  workflow_call:
    inputs:
      config_file:
        description: 'Path to container config file (YAML, JSON, or JS)'
        required: false
        default: 'examples/container-config.example.yml'
        type: string
    secrets:
      HARDENING_WORKFLOWS_CHECKOUT_TOKEN:
        description: 'Token for checking out hardening-workflows repo (required for private GHE)'
        required: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  parse-config:
    name: Parse Container Config
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout hardening-workflows for parser script
        uses: actions/checkout@v4
        with:
          repository: huntridge-labs/hardening-workflows
          # Template Version: 1.0.0 - Check for updates at:
          # https://github.com/huntridge-labs/hardening-workflows/blob/main/.github/workflows/container-scan-from-config.yml
          ref: '2.8.1'
          path: .hardening-workflows
          token: ${{ secrets.HARDENING_WORKFLOWS_CHECKOUT_TOKEN || github.token }}
          sparse-checkout: |
            .github/scripts/parse-container-config.js
            .github/schemas/container-config.schema.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --no-save js-yaml ajv

      - name: Parse and validate config
        id: parse
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          SCHEMA_FILE: .hardening-workflows/.github/schemas/container-config.schema.json
          # ADD YOUR CUSTOM SECRETS HERE
          # Any secret referenced in your config file using ${SECRET_NAME} syntax
          # must be listed here as: SECRET_NAME: ${{ secrets.SECRET_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Example registry secrets (uncomment and add as needed):
          # GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          # ECR_PASSWORD: ${{ secrets.ECR_PASSWORD }}
          # DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # GCR_JSON_KEY: ${{ secrets.GCR_JSON_KEY }}
          # ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          # ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          # MY_REGISTRY_USER: ${{ secrets.MY_REGISTRY_USER }}
          # MY_REGISTRY_PASS: ${{ secrets.MY_REGISTRY_PASS }}
        run: |
          node .hardening-workflows/.github/scripts/parse-container-config.js

  scan-containers:
    name: ${{ matrix.scanner }} - ${{ matrix.name }}
    needs: parse-config
    if: ${{ needs.parse-config.outputs.matrix != '{}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.parse-config.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Container Scanner
        if: matrix.scanner == 'trivy'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: ${{ matrix.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        env:
          TRIVY_USERNAME: ${{ matrix.registry_username }}
          TRIVY_PASSWORD: ${{ matrix.registry_password }}

      - name: Upload Trivy SARIF
        if: matrix.scanner == 'trivy' && matrix.enable_code_security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-container-${{ matrix.name }}

      - name: Run Grype Scanner
        if: matrix.scanner == 'grype'
        id: grype
        uses: anchore/scan-action@v5
        with:
          image: ${{ matrix.image }}
          fail-build: false
          output-format: 'sarif'
        env:
          GRYPE_REGISTRY_AUTH_USERNAME: ${{ matrix.registry_username }}
          GRYPE_REGISTRY_AUTH_PASSWORD: ${{ matrix.registry_password }}

      - name: Upload Grype SARIF
        if: matrix.scanner == 'grype' && matrix.enable_code_security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-container-${{ matrix.name }}

      - name: Run Syft SBOM Generator
        if: matrix.scanner == 'syft'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.image }}
          format: 'spdx-json'
          output-file: 'sbom-${{ matrix.name }}.spdx.json'
        env:
          SYFT_REGISTRY_AUTH_USERNAME: ${{ matrix.registry_username }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ matrix.registry_password }}

      - name: Upload SBOM Artifact
        if: matrix.scanner == 'syft'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: 'sbom-${{ matrix.name }}.spdx.json'
